"A boss from a past Wild Area Event, from Project Pokemon's EventsGallery. Leave it empty, or fold this card, to host the boss you build." = "从 Project Pokémon 的 EventsGallery 选择往期旷野地带新闻的首领。留空或收起此卡片时，使用自行生成的首领。"
"Adventure seed" = "探险种子"
"At the Max Lair, talk to the receptionist, press + to set the same Link Code if you chose one, then choose Invite Others." = "在极巨巢穴与接待员交谈；如已设置连接密码，按 + 输入相同密码，再选择“邀请其他人”。"
"Boss" = "首领"
"BP" = "BP"
"Choose the boss, the Pokemon our player brings and, if you like, the rewards." = "选择首领、我方出战的宝可梦，也可自定义奖励。"
"Choose the legendary, then start the host." = "选择传说的宝可梦，然后启动主机。"
"Clears one quest for the host that pays this BP." = "为主机完成一项任务，获得指定数量的 BP。"
"Close the BP side bar on the console to see the BP come in." = "关闭游戏机上的 BP 侧栏，即可看到 BP 增加。"
"Close the circle on the console to stop." = "在游戏机上解散集友圈即可停止。"
"Dynamax Adventure (Host)" = "极巨大冒险（主机）"
"Eight digits, set on the console with + at the receptionist. Empty for none." = "八位数字。在游戏机上与接待员交谈时按 + 设置；留空则不使用密码。"
"Enter the same Link Code here, choose the task and start." = "在此输入相同的连接密码，选择任务并启动。"
"Enter the same Link Code here, craft the Pokemon and start." = "在此输入相同的连接密码，配置宝可梦并启动。"
"Event boss" = "活动首领"
"For a Pokemon a den holds as Gigantamax: Charizard, Snorlax, Toxtricity and the other Gigantamax Pokemon." = "适用于可在巢穴中以超极巨化形态出现的宝可梦：喷火龙、卡比兽、颤弦蝾螈等。"
"For Snacksworth, talk to him once for each legendary; each talk releases one." = "找点心大叔交谈；每次对话解锁一只传说的宝可梦。"
"From 1 to 9,999,999, the most BP a player holds." = "范围为 1 到 9,999,999，即玩家可持有的 BP 上限。"
"Gigantamax boss" = "超极巨化首领"
"Give BP" = "发放 BP"
"Host a Dynamax Adventure the console joins: you choose the legendary at the end of the Max Lair." = "主持供游戏机加入的极巨大冒险，可选择极巨巢穴终点的传说的宝可梦。"
"Host a Max Raid the console joins: you choose the boss, its rewards and the Pokemon we bring." = "主持供游戏机加入的极巨团体战，可选择首领、奖励和我方出战的宝可梦。"
"Join the Union Circle the console hosts and clear Blueberry Quests for it: every Snacksworth legendary, or the BP you choose." = "加入游戏机主持的集友圈并完成蓝乐活，解锁点心大叔的全部传说的宝可梦，或获得指定数量的 BP。"
"Join the Union Circle the console hosts and spawn the wild Pokemon you craft around its player, to battle and catch." = "加入游戏机主持的集友圈，在玩家周围生成指定的野生宝可梦，供对战和捕获。"
"Leave empty for the den's own rewards, or choose up to {value0} of the rewards the boss's den gives." = "留空使用巢穴默认奖励，也可从首领所在巢穴的奖励中选择最多 {value0} 项。"
"Legendary" = "传说的宝可梦"
"Max Raid (Host)" = "极巨团体战（主机）"
"On the console: X, Poke Portal, Union Circle, then start a group playing locally under a Link Code." = "在游戏机上按 X，进入“宝可入口站 → 集友圈”，通过本地连接创建带连接密码的集友圈。"
"Once POKELDN is in the group, start the circle on the console. As its start demo ends, the quests go in one a second, then our player leaves." = "POKELDN 加入后，在游戏机上开始集友圈。开场演出结束后，每秒完成一项任务，随后我方玩家离开。"
"Once POKELDN is in the group, start the circle on the console. As its start demo ends, the BP clear goes in, then our player leaves." = "POKELDN 加入后，在游戏机上开始集友圈。开场演出结束后完成 BP 任务，随后我方玩家离开。"
"Once POKELDN is in the group, start the circle on the console. As its start demo ends, our player follows yours." = "POKELDN 加入后，在游戏机上开始集友圈。开场演出结束后，我方玩家将跟随你。"
"POKELDN leaves once the adventure starts: a computer partner takes its seat and the adventure goes on." = "探险开始后 POKELDN 离开，其位置由电脑搭档接替，探险继续。"
"Pokemon to spawn" = "要生成的宝可梦"
"Press Ready once POKELDN is in the lobby." = "POKELDN 进入大厅后，选择“准备完毕”。"
"Press Ready: the console runs the battle and our Pokemon fights at your side." = "选择“准备完毕”：游戏机推进战斗，我方宝可梦会与你并肩作战。"
"Reads how many solo and Team quests the host still lacks of the 130 and 12 that release all 25 legendaries, then gives them, one a second: Team quests drawn as the game draws them, then the host's own solo quests as they come up." = "读取解锁全部 25 只传说的宝可梦所需的 130 次个人任务和 12 次集友任务中尚未完成的数量，再每秒完成一项：先按游戏规则抽取集友任务，再完成主机当前的个人任务。"
"Sets the rental Pokemon and the Pokemon met on the way. Leave empty for a random one." = "设置租借宝可梦及途中遭遇的宝可梦。留空则随机生成。"
"Task" = "任务"
"The event's bosses a den can show, with their stars, level and game; the event's rewards that fit the den go with it." = "显示活动巢穴可出现的首领及其星级、等级和游戏版本，并使用适用于该巢穴的活动奖励。"
"The legendary Pokemon waiting at the end of the Max Lair." = "在极巨巢穴终点等待的传说的宝可梦。"
"The raid's boss. A boss a den can hold shows in every console's list; its level sets the stars." = "团体战首领。巢穴支持的首领会出现在所有游戏机的列表中；等级决定星级。"
"The Union Circle's four-digit Link Code." = "集友圈的四位数字连接密码。"
"The wild Pokemon that appears around you in the game, to battle and catch." = "在游戏中出现在你周围、可供对战和捕获的野生宝可梦。"
"Three of the Pokemon come 15 to 25 m around you. One you battle, or walk more than 50 m from, comes back near you." = "三只宝可梦会出现在你周围 15 到 25 米处。与其中一只对战，或离开其位置超过 50 米后，它会重新出现在你附近。"
"Union Circle - Encounters" = "集友圈－野生遭遇"
"Union Circle - Quests" = "集友圈－蓝乐活"
"Unlock all remaining Snacksworth legendaries" = "解锁点心大叔剩余的全部传说的宝可梦"
"With Legal encounters only they wait until the wild Pokemon your game shares show you stand where PKHeX accepts them caught, and go when you walk 50 m from where that was found." = "启用“仅合法遭遇”时，会等待游戏共享的野生宝可梦确认当前位置符合 PKHeX 的捕获合法性；离开确认位置 50 米后停止生成。"
"Y-Comm in local wireless mode: join POKELDN's raid from the list." = "在 YY 通讯中使用本地连接，从列表中加入 POKELDN 的团体战。"
"Empty means random: each IV 0 to 31, as the game draws a wild one." = "留空则随机生成：各项个体值为 0 到 31，与游戏生成野生宝可梦的规则相同。"
"IVs (all six, or empty)" = "个体值（填写全部六项，或留空）"
"Legal encounters only" = "仅合法遭遇"
"No wild slot gives this species: pick another, or turn off Legal encounters only." = "野生遭遇表中没有此种类；请选择其他种类，或关闭“仅合法遭遇”。"
"Offers only what the game's own wild Pokemon can be, and spawns it only while you stand where PKHeX finds it legal once caught." = "仅提供符合游戏野生生成规则的宝可梦，并且只在 PKHeX 判定捕获后合法的位置生成。"
"Pick a species." = "请选择种类。"
"PKHeX accepts it caught at {count} location(s):" = "PKHeX 判定在以下 {count} 个地点捕获合法："
"PKHeX accepts it caught nowhere." = "PKHeX 判定没有可合法捕获的地点。"
"PKHeX is checking where this Pokemon is legal..." = "PKHeX 正在检查此宝可梦的合法捕获地点…"
"Scale (0-255)" = "体型（0－255）"
"Simplified Chinese" = "简体中文"
"Traditional Chinese" = "繁体中文"
"default" = "默认"
"No boss of this event shows in a den" = "此活动没有可在巢穴中出现的首领"
"{count} open listing" = "{count} 条开放中的挂牌"
"{count} open listings" = "{count} 条开放中的挂牌"
"A rental you want" = "想要的租借宝可梦"
"Empty for a random seed" = "留空使用随机种子"
"Find a seed" = "查找种子"
"New seed" = "新种子"
"No seed found; try again." = "未找到种子，请重试。"
"Pokemon on the way" = "途中遭遇的宝可梦"
"Rentals offered" = "可选的租借宝可梦"
"Up to sixteen hexadecimal digits." = "最多十六位十六进制数字。"
"%d %b %Y, %H:%M" = "%Y年%m月%d日 %H:%M"
