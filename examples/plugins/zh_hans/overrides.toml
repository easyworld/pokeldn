"Choose a boss a den holds to choose its rewards." = "选择巢穴支持的首领后，即可选择奖励。"
"Every reward of this den" = "此巢穴的全部奖励"
"Some rewards are not this den's: choose them again." = "部分奖励不属于此巢穴，请重新选择。"
"The den's own rewards." = "巢穴的默认奖励。"
"This den gives this item at this count." = "此巢穴按该数量提供此道具。"
"Choose file" = "选择文件"
"Choose folder" = "选择文件夹"
" (hidden)" = "（隐藏特性）"
"Tera Type" = "太晶属性"
"shiny" = "异色"
"Your save" = "我的存档"
"Egg" = "宝可梦的蛋"
"Code signing policy" = "代码签名策略"
"Union Circle" = "集友圈"
"Max Raid Battles" = "极巨团体战"
"The ferry to Navel Rock, where Ho-Oh and Lugia wait." = "可搭乘渡轮前往肚脐岩，凤王和洛奇亚在那里等待。"
"host a Max Raid den lobby with this boss instead of a Link Trade (docs/swsh_raid.md)" = "使用此首领主持极巨团体战大厅，替代连接交换（docs/swsh_raid.md）。"
"a reward row, item id and count; up to 15; none gives an emulated den's rows" = "奖励行，包含道具 ID 和数量，最多 15 行；不指定时使用模拟巢穴的奖励。"
"the BattleSeed value; random by default" = "BattleSeed 值；默认随机生成。"
"our player readies this long after the guest's lobby opens" = "访客大厅开启后，我方玩家等待指定秒数再准备完毕。"
"host a Max Raid with a boss of this Wild Area Event delivery (an EventsGallery 'Index NNN' folder) instead of --raid-boss; its rewards unless --raid-reward (docs/swsh_raid.md, Event raids)" = "使用此旷野地带新闻分发的首领主持极巨团体战，替代 --raid-boss。指定 EventsGallery 的“Index NNN”目录；除非提供 --raid-reward，否则使用活动奖励（docs/swsh_raid.md，活动团体战）。"
"with --raid-event: the star rank, 1 to 5" = "配合 --raid-event 使用：星级，范围为 1 到 5。"
"with --raid-event: the boss, numbered as the list printed without it" = "配合 --raid-event 使用：首领编号；不指定时显示可选首领的编号列表。"
"with --raid-event: the den area whose table the boss comes from" = "配合 --raid-event 使用：首领所用遭遇表对应的巢穴区域。"
"with --raid-event: roll each drop's chance as a den does, or give every drop" = "配合 --raid-event 使用：按巢穴规则随机决定各项掉落，或提供全部掉落。"
"the --raid-boss boss is Gigantamax; a retail console accepts it where a base den holds that Gigantamax Pokemon (docs/swsh_raid.md)" = "将 --raid-boss 首领设为超极巨化；实机只接受基础巢穴中存在的对应超极巨化宝可梦（docs/swsh_raid.md）。"
"put the console first in BattleStart and framework object 0, so it serves the battle and the board answers as a client (docs/swsh_raid.md)" = "在 BattleStart 及框架对象 0 中将游戏机放在首位，使游戏机推进战斗，开发板作为客户端回应（docs/swsh_raid.md）。"
"host a Dynamax Adventure (Max Lair) lobby whose legendary is this species; the host leaves once the adventure starts (docs/swsh_raid.md)" = "主持极巨大冒险（极巨巢穴）大厅，终点的传说的宝可梦为指定种类；探险开始后主机离开（docs/swsh_raid.md）。"
"the adventure seed (ChikaBattleSeed): the rentals and encounters; random by default" = "探险种子（ChikaBattleSeed），决定租借宝可梦及途中遭遇；默认随机生成。"
"leave this long after the legendary is sent; a computer partner then takes our seat and picks our rental" = "发送传说的宝可梦后等待指定秒数再离开；电脑搭档随后接替我方位置并选择租借宝可梦。"
"scans for a matching search (--scene) before giving up" = "放弃前扫描符合 --scene 条件的搜索的次数。"
"the LDN scene id to seat in: 60001 a Link Trade search; any takes the first Sword network (a Max Raid den, docs/swsh_gift.md)" = "加入的 LDN 场景 ID：60001 为连接交换搜索；any 选择首个剑版网络（极巨团体战巢穴，docs/swsh_gift.md）。"
"a Max Raid den guest: after the snapshot send PlayerInfo, BattleReady and SelectPokemon (the --offer-slot Pokemon); use with --scene 60006" = "作为极巨团体战巢穴访客：收到快照后发送 PlayerInfo、BattleReady 和 SelectPokemon（--offer-slot 指定的宝可梦）；配合 --scene 60006 使用。"
"a Dynamax Adventure (Max Lair) guest: the lobby, the paths and the battles; use with --scene 50000" = "作为极巨大冒险（极巨巢穴）访客，参与大厅、路线及战斗；配合 --scene 50000 使用。"
"an encrypted party PK8 sent as our rental instead of the offered one" = "发送此加密队伍 PK8 作为我方租借宝可梦，替代提供的租借宝可梦。"
"the offer place we take; by default the first the host left" = "选择租借列表中的位置；默认使用主机留下的首个位置。"
"press ready this many seconds after the host acked the lobby messages" = "主机确认大厅消息后，等待指定秒数再准备完毕。"
"the move slot our Pokemon uses every turn" = "我方宝可梦每回合使用的招式位置。"
"the name the raid lobby shows for us" = "团体战大厅中显示的我方名称。"
"join the Union Circle a console hosts, as a raid guest joins a raid: take the seat, send our identity, open the game's channel, answer the host's start, put our player on the field where the host's stands and hold it for --hold (docs/sv_union_circle.md)" = "加入游戏机主持的集友圈：占据席位、发送身份、开启游戏频道、回应主机开始消息，然后将我方玩家放在主机所在位置，保持 --hold 指定的时长（docs/sv_union_circle.md）。"
"with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP" = "配合 --union-circle 使用：任务完成后离开集友圈并结束运行。snacksworth 在开场演出结束后每秒完成一项集友或个人任务，补齐点心大叔全部传说的宝可梦所需次数；bp 完成一项任务，向主机发放 --bbq-clear 指定的 BP。"
"the BP, 1 to 9999999, --circle-task bp gives" = "--circle-task bp 发放的 BP 数量，范围为 1 到 9999999。"
"with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it" = "配合 --union-circle 使用：我方玩家跟随主机的移动、动画及骑乘状态，保持 5 米距离并面向主机。"
"with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it" = "配合 --union-circle 使用：开场演出结束 10 秒后，在主机玩家周围 15 到 25 米处保持 3 只此种类的野生宝可梦（开发编号）。主机与其对战、移除或离开超过 50 米后，宝可梦会在附近重新生成。"
"Tera Type, 0 Normal to 17 Fairy in type order (default %(default)s)" = "太晶属性，按属性顺序从 0（一般）到 17（妖精）；默认 %(default)s。"
"held item id" = "携带道具 ID。"
"0 to 255 (default random)" = "范围为 0 到 255，默认随机生成。"
"1 female (default 0)" = "1 为雌性，默认 0。"
"0 to 24 (default random)" = "范围为 0 到 24，默认随机生成。"
"six IVs 0 to 31 (default each random, as a wild one's)" = "六项个体值，范围为 0 到 31；默认按野生宝可梦规则分别随机生成。"
"ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)" = "特性位置，2 为隐藏特性；默认按野生宝可梦规则随机选择 0 或 1。"
"with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)" = "配合 --spawn 使用：仅当主机位于 PKHeX 判定捕获合法的区域时生成。区域由主机游戏机共享的野生宝可梦推断；我方玩家靠近后才会共享，可配合 --follow-host 使用。"
"with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way" = "配合 --union-circle 使用：打印每条发出的集友圈消息及区域搜索的各个步骤；无论是否启用，--capture 文件都会保存这些步骤。"
