"carry the peer's announcement clock in our acknowledgement on clone type 2 rather than the clock round-tripped from our own announcement, which is what a reference joiner carries" = "在克隆类型 2 的确认中使用对方公告时钟，替代本机公告往返得到的时钟。"
"celebi" = "Celebi"
"clear [3], which makes the console skip the variable-id comparison" = "清除字节 [3]，使游戏机跳过可变 ID 比较。"
"client script fields must fit in u32" = "客户端脚本字段必须在 u32 范围内"
"colosseum-pikachu" = "竞技场皮卡丘"
"comma-separated 0-based offered slots for multiple trades" = "多次交换时提供的队伍位置，用逗号分隔，从 0 开始计数。"
"compiler" = "编译器"
"compress the message, the way the console compresses every 0x80 message it sends. The flag is the Pia message's (0x10 at version 4), so this is free either way - and it is one variable, so sweep it alone" = "压缩消息，使用版本 4 的 Pia 0x10 标志，与游戏机的 0x80 消息行为一致。"
"console" = "游戏机"
"consoles the raid waits for, 1 to 3; it starts once N are in the lobby and every one is Ready, or when the lobby timer runs out" = "等待加入的游戏机数量，范围为 1 到 3；指定数量的游戏机全部进入大厅并准备完毕，或大厅倒计时结束时开始团体战。"
"copy the console's whole 128 KB save into FILE (.sav); the console's save is not changed [docs/frlg_gift.md, Save backup and restore]" = "将游戏机完整的 128 KB 存档复制到 FILE（.sav），不改变游戏机存档。"
"create-mon" = "生成宝可梦"
"custom merged image; default: bundled firmware" = "自定义合并镜像；默认使用随包固件"
"dark" = "恶"
"decimal trainer ID, optionally followed by decimal secret ID" = "十进制训练家 ID，可在后面附加十进制里 ID。"
"decline at the confirm prompt (confirm-NO -> immediate READY_CANCEL, graceful cancel-to-leave) [trade.c:2019-2023]" = "在确认提示中选择拒绝，立即发送 READY_CANCEL 并正常离开。"
"default" = "默认"
"default the Union Room's, or the password room's with --password" = "默认使用联合房间场景，指定 --password 时使用密码房间场景。"
"definition must be a WonderGift" = "definition 必须为 WonderGift"
"delay_frames must fit in 16 bits" = "delay_frames 必须在 16 位整数范围内"
"delegate transmit CCMP to mac80211/hardware; over-air frames remain encrypted" = "由 mac80211／硬件执行 CCMP 发送加密，无线帧仍保持加密。"
"destination bitmap word, big-endian at wire[9]; the console drops a message unless the bit for its own station index (1) is set, so bit 1 = 0x2" = "目标位图，wire[9] 大端字；须设置对方索引 1 的位，即 0x2，才能被游戏机接收。"
"destination-bit count on the host's reliable message; 2 so the console's own station index (1) is in range of the body destination-bitmap check" = "主机可靠消息的目标位数；2 使对方站点索引 1 落在位图范围内。"
"diagnostic: consecutive polls the opening SEND_PLAYER_IDS burst occupies before the LinkPlayer block request; default is the built-in timing" = "诊断：请求 LinkPlayer 数据块前，开场 SEND_PLAYER_IDS 连续占用的轮询帧数。默认使用内置时序。"
"diagnostic: idle VBlanks between the blocks of one Mystery Gift message; raise it if a run stalls part-way through a message (default is the built-in timing)" = "诊断：同一神秘礼物消息的数据块间空闲帧数；传输中途停滞时可增加，默认内置时序。"
"diagnostic: quiet child polls after LinkPlayer standby before the first Mystery Gift message; default is the built-in timing" = "诊断：LinkPlayer 待机后，首个神秘礼物消息前的空闲轮询帧数；默认内置时序。"
"diagnostic: quiet console polls after the LinkPlayer exchange before the leader starts the trainer-card exchange itself" = "诊断：交换 LinkPlayer 数据后，主机开始交换训练家卡前的空闲轮询帧数。"
"directory for --make-artifact output (default: artifacts)" = "--make-artifact 的输出目录，默认 artifacts。"
"disconnect sent before the close-link handshake" = "在关闭连接握手前发送了断开请求"
"do not accept the frames rtw88 has already decrypted. With this the host reads nothing on that adapter" = "不接受 rtw88 已解密的帧；启用后该适配器可能无法接收数据。"
"do not acknowledge reliable streams" = "不确认可靠数据流。"
"do not acknowledge the host's messages on the game's reliable channel 0x7c" = "不确认主机在游戏可靠通道 0x7c 上的消息。"
"do not answer RTT requests" = "不回应 RTT 请求。"
"do not answer a Session type-5 station update with the type 6" = "不以类型 6 回应 Session 类型 5 站点更新。"
"do not answer a join request with the type-1 ack (buys 8 s, completes nothing)" = "不以类型 1 确认回应加入请求；仅延长等待，无法完成加入。"
"do not answer a join request with the type-2 join response" = "不以类型 2 加入响应回应加入请求。"
"do not load host.local.toml" = "不加载 host.local.toml。"
"do not send the Clone Clock request. A seated joiner sends eighteen zero bytes on 0x77 before anything else and the host answers" = "不发送 Clone Clock 请求；正常加入方会先发送十八个零字节的 0x77 请求。"
"download it from Arm's page, then check again" = "从 Arm 官网下载，然后重新检查"
"dragon" = "龙"
"draw a new encryption constant and PID for every offered Pokemon" = "为每只提供的宝可梦生成新的加密常量及 PID。"
"draw a new encryption constant and PID for the offered Pokemon" = "为提供的宝可梦生成新的加密常量及 PID。"
"ek3" = "ek3"
"electric" = "电"
"emerald" = "绿宝石"
"emit each block fragment N times (1-8, default 2); bounded redundancy against the console's silent datagram drops" = "每个块片段重复发送次数，1 至 8，默认 2，用于应对静默丢包。"
"end a seat on which the console has sent nothing at all for this many seconds, and go back to scanning. An association taken outside the console's host phase carries no traffic; without this the run holds it for the whole --hold" = "此秒数内游戏机完全未发送数据则结束连接并重新扫描，避免空连接占满 --hold。"
