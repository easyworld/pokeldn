"travel-anywhere" = "按 R 飞翔"
"treat an offered Deoxys/Mew as PARTNER_MON_INVALID and cancel-to-leave (the host's illegitimate-legend gate; legitimacy is not offline-decodable) [trade.c:1965-1968]" = "将对方提供的代欧奇希斯／梦幻视为 PARTNER_MON_INVALID 并取消交换；此游戏内传说宝可梦检查无法离线判定。"
"under a minute left" = "剩余不到 1 分钟"
"units one position message spans. The default is what a console's own walk measures (0.93 units every 0.41 s, over 80 of its messages); our first walks did 0.15 every 0.6 s, which is a ninth of a real player's speed and is the whole of the stutter" = "每条位置消息移动的距离，默认实测 0.93 单位／0.41 秒；过小会导致明显卡顿。"
"unown-letters" = "未知图腾字母"
"until stopped" = "直到手动停止"
"update-ack" = "更新确认"
"use FireRed's session-wide incrementing Pia nonce" = "使用火红整个会话递增的 Pia nonce。"
"use Pia-backed send-once block delivery (recommended); --no-trust-pia enables diagnostic RFU retransmits" = "控制 Pia 单次发送与 RFU 重传；--no-trust-pia 启用诊断用 RFU 重传。具体默认行为以当前工具为准。"
"values for byte [0x10]" = "字节 [0x10] 的测试值。"
"values for byte [1], list or LO-HI" = "字节 [1] 的测试值，使用列表或 LO-HI 范围。"
"values for the MESSAGE flags byte. 0x09 is what the console puts on its own Local Protocol messages; BDSP's station requests carry 0x11" = "消息标志字节的测试值。游戏机自身本地协议用 0x09，晶灿钻石／明亮珍珠站点请求用 0x11。"
"values for the header byte at 0x05 on the requests, and their IV source id; list or LO-HI" = "请求头部 0x05 字节及对应 IV 源 ID 的测试值，使用列表或 LO-HI 范围。"
"values for the platform byte at [2]. 9 is the real one; ANY other value is answered with a connection response rather than dropped, which is the probe for whether our message reaches the 0x14 handler at all" = "平台字节 [2] 的测试值。真实值为 9；其他值会返回连接响应，供检查是否到达 0x14 处理器。"
"violet" = "紫"
"visiting-trainer" = "来访训练家"
"wait for this payload on --send2-protocol before sending; omit to send as soon as the mesh is up" = "等待 --send2-protocol 上此载荷后再发送；省略则网络建立后立即发送。"
"water" = "水"
"what a console that does not know the phrase reads (max 63 characters); the default is 'That is not the phrase.'" = "问卷短语不匹配时显示的消息，最多 63 字符，默认 That is not the phrase.。"
"what to send when the console migrates the mesh. \"auto\" sends MIGRATION_FINISH when the start names US as the next host and a MIGRATION_RESPONSE when it names anyone else, which is what the binary says. \"response\" always answers 0x48, for comparison" = "网络迁移回应方式：auto 在本机成为新主机时发送 MIGRATION_FINISH，否则发送 MIGRATION_RESPONSE；response 始终发送 0x48 供比较。"
"when the CONFIRMATION envelope (40040) sends a four-byte status whose body ends `0100` - the same cue the selection content sends before its Pokemon - reply with SyncSaveDataHolder{syncCommand{data:N}} on that content's 10000-base holder, id 10040, reliable port 0, and answer the status itself on port 1. Content 40 takes a command and not a Pokemon: its parser 0x010df6d0 accepts one submessage carrying one int32. Its own machine sends 0, 1, 2 and 3 in that order (swsh_trade.SYNC_COMMANDS)" = "收到确认内容 40040 的状态（尾部 0100）时，在端口 0 发送 SyncSaveDataHolder 命令，并在端口 1 回应状态。内容 40 依次使用命令 0、1、2、3。"
"when the console follows its selection-phase Pokemon with the status whose body ends `0100`, offer OUR Pokemon on that content's 10000-base holder (id 10050) on reliable port 0 and answer the status on port 1" = "收到选择阶段尾部 0100 状态时，在端口 0 的 holder 10050 提供本机宝可梦，并在端口 1 回应状态。"
"when the console hands us the host role before the announcement (not a player leaving), leave its network and become the host with bin/sv_host.py on the same channel and code, as bin/pla_join.py does; needs --answer-migration" = "控制接管主机流程：游戏机在公告前交出角色时，离开并以相同信道及密码运行 bin/sv_host.py；需要 --answer-migration。"
"when the console hands us the host role, leave its network and become the host with bin/pla_host.py on the same code and channel" = "游戏机交出主机角色时，离开其网络并以相同信道和密码运行 bin/pla_host.py 担任主机。"
"when the console sends game message ID, answer once with the body in FILE (raw bytes, no header): 0x15:capsule.bin answers its ball capsule with ours, 0x14:record.bin its record" = "收到游戏消息 ID 后，以 FILE 的原始消息体回应一次，例如 0x15:capsule.bin 交换球壳、0x14:record.bin 交换记录。"
"when the hosting console leaves, ack its update session carrying the host-migration state and leave the network on its START_HOST_MIGRATION, as its own clients do; each step waits 10 s unanswered" = "主机游戏机离开时，确认带迁移状态的会话更新，并在 START_HOST_MIGRATION 后离网。"
"where identity10.bin, identity11b.bin and selection.bin live; by default the ones pokeldn.za.reference ships" = "identity10.bin、identity11b.bin 及 selection.bin 所在目录，默认使用 pokeldn.za.reference。"
"where our character spawns relative to the console's own, on x. The default +2.0 is one fixed side, and a player standing against the wall on that side gets a character spawned out of bounds (followed by a crash). Negative puts it on the other side" = "角色出生位置相对对方的 x 偏移，默认 +2.0。对方靠墙时可能越界并导致游戏崩溃；负值改为另一侧。"
"where our character stands: x,y,z,rot_y (a retail host's own spot)" = "角色位置：x,y,z,rot_y，参考值为实机主机位置。"
"where the reference payloads (identity10.bin, selection.bin, ...) live; by default the ones pokeldn.za.reference ships" = "参考身份与选择载荷所在目录，默认使用 pokeldn.za.reference。"
"where to write the Pokemon the console offers; trade N > 1 writes FILE-N" = "保存对方提供宝可梦的路径；第 N 次交换（N > 1）写入 FILE-N。"
"which SyncPingDataHolder field --sync-after-hash sends: 1 ping, 2 pingReply, 3 pingSynced (`780000001a00`, the one the trace records)" = "--sync-after-hash 发送的同步字段：1 为 ping，2 为 pingReply，3 为 pingSynced。"
"which activity --union-room advertises; default 'in-room', the bare IN_UNION_ROOM a console standing in the room connects to. 'search' is what the screen before the room looks for (untested)" = "联合房间广播的活动。in-room（默认）表示已在房间内；search 表示进入房间前的搜索状态，尚未验证。"
"which map group the RAM script binds to (a group_order index in\n[decomp:data/maps/map_groups.json]). The default is the player's house, where the\nmother never moves. Cerulean Cave B1F is group 1 map 74, and MEWTWO is object 3." = "RAM 脚本绑定的地图组索引。默认玩家家中的妈妈；华蓝洞窟地下 1 层为组 1、地图 74，超梦为对象 3。"
"which map group the RAM script binds to (a group_order index in [decomp:data/maps/map_groups.json]). The default is the player's house, where the mother never moves. Cerulean Cave B1F is group 1 map 74, and MEWTWO is object 3." = "RAM 脚本绑定的地图组索引。默认玩家家中的妈妈；华蓝洞窟地下 1 层为组 1、地图 74，超梦为对象 3。"
"which map in that group the RAM script binds to." = "RAM 脚本绑定的地图在组内的编号。"
"which object event on that map. Local ids are assigned in map.json order and start\nat 1. Binding REPLACES that object's own script, so choose one that never moves." = "地图对象的本地事件 ID，按 map.json 顺序从 1 开始。绑定会替换该对象的原脚本，请选择不移动的对象。"
"which object event on that map. Local ids are assigned in map.json order and start at 1. Binding REPLACES that object's own script, so choose one that never moves." = "地图对象的本地事件 ID，按 map.json 顺序从 1 开始。绑定会替换该对象的原脚本，请选择不移动的对象。"
"which of the 32 ack slots to fill; \"all\" (the default) fills every one, because only the slot at some station index is read and whose index it is has not been settled. \"0\" is the console, \"1\" is us" = "填充 32 个确认槽中的哪些位置：all（默认）全部填充，0 为游戏机，1 为本机。"
"which party slot of --send-snapshot to offer back, 1-6; 0 offers nothing and only records what the console offers us" = "--send-snapshot 中提供的队伍位置，1 至 6；0 表示不提供，仅记录对方宝可梦。"
"whose addresses a hook, a stub or a ROM call is built with: BPRF, BPGF, BPRE, BPGE, BPRS, BPGS, BPRD, BPGD, BPRI, BPGI, BPRJ, BPGJ. auto (the default) builds for each and sends the one the console's game code names, before anything address-dependent is sent; another code is refused. A game code serves only that cartridge. Bytes with no build address go to any console either way" = "选择生成代码使用的卡带地址。auto 根据游戏机报告的卡带代码自动选择对应语言和版本，不匹配的代码会被拒绝。"
"whose constant and variable id go in the response's two id fields - a deduction, so 'both' alternates them across the retransmits" = "响应中两个 ID 字段使用的固定／可变 ID；both 在重发时交替两种顺序以便比较。"
"wifi phy for the LDN join (live)" = "实机加入 LDN 时使用的 Wi-Fi 物理设备。"
"wire mpId / gLocalLinkPlayerId (joiner = 1 = right seat; the only valid value - mpId 0 is the host/parent) [trade.c:1816; link_rfu_2.c:1633-1638]" = "连接玩家 ID：加入方固定为 1（右侧位置），0 为主机。"
"wish-egg" = "祈愿蛋"
"with --buffer-script call-chain: one step, repeatable, up to 16, run in order in one frame. `call:NAME_OR_ADDR[,ARG]...` calls a ROM function (AddBagItem, AddMoney, AddPCItem, CalcCRC16, CheckBagHasItem, CheckBagHasSpace, CompactPartySlots, CreateMon, FlagClear, FlagGet, FlagSet, GetMoney, GetSetPokedexFlag, GetVarPointer, IncrementGameStat, InitRamScript, IsEnoughMoney, ItemIsMail, Random, ReadFlash, RemoveBagItem, RemoveMoney, RunScriptImmediately, SeedRng, SpeciesToNationalPokedexNum, StringCompare, VarGet, VarSet, or a THUMB address); `read32|read16|read8:ADDR` reads; `write32|write16|write8:ADDR,VALUE` writes and reads itself back, and needs --write-unsafe. A target of `prev` is the PREVIOUS step's result and `prev+N` is N bytes past it, which is how a function that returns a pointer becomes a write; an op may carry +keep to leave prev alone. Example: --chain-step call:GetVarPointer,0x4024 --chain-step write16:prev,7. A named function is resolved on the console's build" = "call-chain 的步骤，可重复指定，最多 16 步，在同一帧依次执行。call:NAME_OR_ADDR[,ARG]... 调用函数；read32|read16|read8:ADDR 读取；write32|write16|write8:ADDR,VALUE 写入并读回，须启用 --write-unsafe。prev 表示上一步结果，prev+N 表示其后 N 字节。"
"with --buffer-script call: one argument word, repeatable, up to eight. The first four go in r0..r3 and the rest on the stack at [sp+0..12], where CreateMon's own prologue reads them" = "函数调用的参数字，可重复指定，最多八个。前四个放入 r0 至 r3，其余放在栈上。"
"with --buffer-script call: one word read immediately before and immediately after the call, both returned. gRngValue is 0x03004220 French, 0x030042D0 English. For a function that returns nothing, such as SeedRng, this is the only evidence the call did what it was called for" = "函数调用前后各读取一次的地址，两次值都会返回。gRngValue：法语版 0x03004220，英语版 0x030042D0。"
"with --buffer-script call: the ROM function to call, as a THUMB pointer (bit 0 set). SeedRng is 0x080486D1 and Random 0x080486B1 on the French cartridges, 0x08048691 and 0x08048671 on the English ones [builds.py]. The address is sent as given, so pair it with --console-build. 0 calls nothing, which checks the send path with the ROM left out" = "调用的 THUMB ROM 函数地址，最低位置 1，请与 --console-build 对应。法语版 SeedRng／Random 为 0x080486D1／0x080486B1，英语版为 0x08048691／0x08048671；0 表示不调用。"
"with --buffer-script create-mon --create-mon-ot-id-type 1: the OT id to use" = "--create-mon-ot-id-type 为 1 时使用的初训家 ID。"
"with --buffer-script create-mon: 0 = the OT is the player and the id comes off the real save, 1 = use --create-mon-ot-id, 2 = rolled until not shiny" = "初训家 ID 来源：0 使用真实存档中的玩家 ID，1 使用 --create-mon-ot-id，2 随机生成直到非异色。"
"with --buffer-script create-mon: append the finished mon to the player's party. The slot is computed from gSaveBlock1Ptr, never given, and it is always the first free one - playerParty[playerPartyCount] - so an occupied slot is never touched and no Pokemon can be destroyed. A full party writes nothing and says so. This is the player's live SAVE and the console commits it to flash: needs --write-unsafe" = "将创建的宝可梦加入玩家队伍的第一个空位；队伍已满时不写入。修改真实存档且会保存，须启用 --write-unsafe。"
"with --buffer-script create-mon: copy the finished 100 bytes to this address in the console's memory. The mon is built in our own image either way, so without this nothing on the console is written at all. Needs --write-unsafe" = "将创建的 100 字节宝可梦复制到指定内存地址，须启用 --write-unsafe；未指定时不写入游戏机内存。"
"with --buffer-script create-mon: every IV set to this, 0..31. 32 or more rolls them instead [USE_RANDOM_IVS], which makes the run non-deterministic" = "所有个体值设为此值，0 至 31；32 或更大则随机生成。"
"with --buffer-script create-mon: the 32-bit personality value, which fixes the nature, the gender, the ability slot and, with the trainer ids, whether the mon is shiny. Omitted, the console rolls one with Random32" = "32 位 PID，决定性格、性别、特性位置及异色状态；省略时由游戏机 Random32 随机生成。"
"with --buffer-script create-mon: the ROM function to call with eight arguments, a THUMB pointer. The default is the console build's CreateMon (0x08041151 French, 0x080411FD English); 0 calls nothing, which checks the send path with the ROM left out" = "create-mon 的 THUMB CreateMon 函数地址。默认根据卡带版本选择（法语版 0x08041151，英语版 0x080411FD）；0 表示不调用。"
"with --buffer-script create-mon: the level, 1..100" = "创建宝可梦的等级，1 至 100。"
"with --buffer-script create-mon: the same run as --create-mon-append - the same call, the same arithmetic on the same gSaveBlock1Ptr - with the two stores that would change the save left out. It reports the party count and the address it would have written, and reads that slot's current 100 bytes back so the answer says what a real run would overwrite. Writes nothing, so it needs no override" = "模拟加入队伍：报告队伍数量、目标地址及该位置现有的 100 字节数据，不修改存档，无需启用写入覆盖。"
"with --buffer-script create-mon: the species number, 1..411 (internal numbering, not the National Dex)" = "创建宝可梦的种类 ID，1 至 411，使用第三世代内部编号而非全国图鉴编号。"
"with --buffer-script flash-patch: byte offset of the field inside the sector's data" = "flash-patch 要修改的字段在扇区数据内的字节偏移。"
"with --buffer-script flash-patch: the replacement bytes for that field, as hex. Everything else in the sector is whatever the game's own save routine wrote" = "字段的替换字节（十六进制）；扇区其他内容保留游戏原存档数据。"
"with --buffer-script flash-read: byte offset into the sector to start reading at" = "flash-read 在扇区内开始读取的字节偏移。"
"with --buffer-script flash-write: added to each word of the pattern" = "闪存填充模式中相邻字的递增值。"
"with --buffer-script flash-write: compose a WELL-FORMED save sector instead of a raw pattern - the console zeroes past the data, computes the game's own checksum over the 3968-byte data area and lays down id, checksum, signature and counter" = "生成规范存档扇区：数据之后补零，对 3968 字节数据区计算游戏校验和，并写入 ID、校验和、签名及计数器。"
"with --buffer-script flash-write: how many words of the sector to compose" = "扇区内要填充的字数量。"
"with --buffer-script flash-write: the 4 KB flash sector (0..31) swi 0x48 writes. Sectors 0..27 are the two save bands and need --write-unsafe; 28..31 are outside both" = "flash-write 的 4 KB 闪存扇区，0 至 31。0 至 27 属于两个存档区，须启用 --write-unsafe；28 至 31 在存档区外。"
"with --buffer-script flash-write: word[0] of the pattern the console composes" = "闪存填充模式的第一个字（word[0]）。"
"with --buffer-script install-resident: a hook parameter, e.g. extra=6" = "常驻钩子的参数，例如 extra=6。"
"with --buffer-script install-resident: the hook to install (turbo)" = "要安装的常驻钩子，例如 turbo。"
"with --buffer-script memory-dump-multi: how many consecutive blocks to pull in ONE session. MG_LINK_BUFFER_SIZE caps a message, not a session, so the client script runs the payload once per block and each pass sends the next one" = "memory-dump-multi 在同一会话读取的连续块数，每次脚本调用发送下一个块。"
"with --buffer-script memory-dump-scatter: the UNRELATED addresses to read, one block each, in this order. A plan asks for scattered kilobytes rather than one long region, and this is the payload that answers it. Accepts 0x hex" = "memory-dump-scatter 要依次读取的分散地址，每个地址读取一个块；支持 0x 十六进制。"
"with --buffer-script memory-dump: how many bytes to read, 1..1024 (MG_LINK_BUFFER_SIZE)" = "memory-dump 的读取字节数，1 至 1024。"
"with --buffer-script memory-dump: the console address to read out (0x02000000 EWRAM, 0x03000000 IWRAM, 0x08000000 ROM). Accepts 0x hex" = "memory-dump 要读取的地址：0x02000000 为 EWRAM，0x03000000 为 IWRAM，0x08000000 为 ROM。支持 0x 十六进制。"
"with --buffer-script memory-scan: 32-byte blocks scanned per frame, the budget the console's link has to live with (default 512, about 3 ms of a 16 ms frame)" = "每帧扫描的 32 字节块数，默认 512，约占 16 毫秒一帧中的 3 毫秒。"
"with --buffer-script memory-scan: one past the last address to read (default 0x09000000, the end of a 16 MB cartridge)" = "内存扫描结束地址（不包含），默认 0x09000000，即 16 MB 卡带的末尾。"
"with --buffer-script memory-scan: the 32-bit value to search for. The payload returns 0 to be called again next frame, so one run scans a whole range instead of the 1024 bytes a dump reads. Accepts 0x hex" = "memory-scan 要查找的 32 位值，支持 0x 十六进制；脚本每帧继续扫描，可覆盖整个范围。"
"with --buffer-script memory-scan: the watchdog. A payload that never returns 1 hangs the Mystery Gift menu, so the scan gives up and answers after this many frames (default: what the range needs, plus two)" = "内存扫描的最大帧数。超时后会停止并回应，避免神秘礼物菜单卡住；默认所需帧数加二。"
"with --buffer-script memory-scan: where to start, 32-byte aligned (default 0x08000000, the cartridge)" = "内存扫描起始地址，须按 32 字节对齐，默认 0x08000000。"
"with --buffer-script rng-trace: a ROM function to call between the two reads of each sample, as a THUMB pointer (bit 0 set), or 0 for none. Random is 0x080486B1 French, 0x08048671 English; the recurrence between the two reads is then the proof that both addresses are what we say they are" = "两次采样读取之间调用的 THUMB ROM 函数地址（最低位置 1），0 表示不调用。Random：法语版 0x080486B1，英语版 0x08048671。"
"with --buffer-script rng-trace: how many frames to sample, 1..96" = "随机数追踪的采样帧数，1 至 96。"
"with --buffer-script rng-trace: the word to sample once a frame. gRngValue is 0x03004220 on the French cartridges and 0x030042D0 on the English ones [builds.py]. Accepts 0x hex" = "每帧采样的随机数地址：法语版 gRngValue 为 0x03004220，英语版为 0x030042D0。支持 0x 十六进制。"
"with --buffer-script rom-checksum: 32-byte chunks summed per frame (default 512, no more load on the frame than memory-scan's 512)" = "每帧计算校验和的 32 字节片段数，默认 512。"
"with --buffer-script rom-checksum: one past the last address to sum, a whole number of blocks after --sum-start (default 0x09000000)" = "ROM 校验结束地址（不包含），范围须包含整数个块，默认 0x09000000。"
"with --buffer-script rom-checksum: the ROM image to compare the sums with (default: the image config.REFERENCE_ROMS names for the console's build)" = "用于对照校验和的 ROM 文件，默认根据游戏机构建版本读取 config.REFERENCE_ROMS。"
"with --buffer-script rom-checksum: the block size, a power of two from 32; the range holds at most 128 blocks (default 0x20000)" = "校验块大小：不小于 32 的二次幂，整个范围最多 128 块；默认 0x20000。"
"with --buffer-script rom-checksum: the watchdog, in calls (= frames) (default: what the range needs, plus two)" = "ROM 校验最大调用次数（帧数），默认所需帧数加二。"
"with --buffer-script rom-checksum: where to start, aligned to --sum-block (default 0x08000000, the cartridge)" = "ROM 校验起始地址，须按 --sum-block 对齐，默认 0x08000000。"
"with --buffer-script save-dump: byte offset into that block. Accepts 0x hex" = "存档块内的字节偏移，支持 0x 十六进制。"
"with --buffer-script save-dump: which save block to read; sav2 is name, trainer id and pokedex, sav1 is party, bag, money, flags and vars" = "读取的存档块：sav2 包含名称、训练家 ID 和图鉴；sav1 包含队伍、背包、金钱、标志及变量。"
"with --buffer-script save-write: ascii to write into the save block at --dump-offset. The same region is read back in the same run, so the answer is the proof. The console saves afterwards, so it reaches flash" = "在 --dump-offset 位置写入 ASCII 文本，随后读回验证；游戏机会保存至闪存。"
"with --buffer-script save-write: the bytes to write, as hex" = "要写入存档的字节，使用十六进制。"
"with --buffer-script sloop-svc: a syscall, 0x40..0x62 (0x4D is the bad-word check); repeat for up to eight, issued in order in one session" = "sloop-svc 的系统调用号，0x40 至 0x62，0x4D 为不当用语检查；最多八个，按顺序执行。"
"with --buffer-script sloop-svc: issue THUMB `bkpt N` instead of `swi N` (0xFF is the one the game never issues; needs --write-unsafe)" = "以 THUMB bkpt N 替代 swi N；0xFF 为游戏未使用的指令，须启用 --write-unsafe。"
"with --buffer-script sloop-svc: point this register at the console's copy of the data" = "将此寄存器指向游戏机中的数据副本。"
"with --buffer-script sloop-svc: r0, r1, r2, r3 in order (repeatable)" = "系统调用的 r0、r1、r2、r3 参数，按顺序重复指定。"
"with --buffer-script sloop-svc: the data as hex instead" = "以十六进制指定系统调用数据。"
"with --buffer-script sloop-svc: up to 256 bytes of UTF-8 data to send" = "系统调用发送的 UTF-8 数据，最多 256 字节。"
"with --buffer-script string-gather: bytes from one pointer to the next (default 12, struct EasyChatWordInfo, whose `text` is at offset 0; a plain array of `const u8 *` is 4)" = "相邻字符串指针的字节间隔，默认 12（EasyChatWordInfo）；普通指针数组为 4。"
"with --buffer-script string-gather: how many pointers to follow at most" = "最多跟随的字符串指针数量。"
"with --buffer-script string-gather: longest string accepted, terminator included. A pointer that is not a string would otherwise be copied until it met an 0xFF (default 64)" = "最长字符串字节数（含终止符），默认 64；防止无效指针无限读取。"
"with --buffer-script string-gather: the address of the first pointer in an array to follow. The answer is the strings themselves, back to back, so one run carries a whole table instead of a window of mostly-pointers. Accepts 0x hex" = "string-gather 要跟随的指针数组的首地址，支持 0x 十六进制；返回连续排列的字符串本身。"
"with --buffer-script table-scan: 16-byte blocks scanned per frame (default 192, the same instruction load on the frame that memory-scan's 512 costs)" = "每帧扫描的 16 字节块数，默认 192。"
"with --buffer-script table-scan: how many words in a row make a run worth reporting (default 12, the twelve gSpecialVar_0x8000..0x800B entries)" = "值得报告的连续字数量，默认 12，对应 gSpecialVar_0x8000 至 0x800B。"
"with --buffer-script table-scan: one past the last address to read (default 0x09000000)" = "表扫描结束地址（不包含该地址），默认 0x09000000。"
"with --buffer-script table-scan: the watchdog, in calls (= frames)" = "表扫描的最大调用次数（帧数），用于看门狗超时。"
"with --buffer-script table-scan: what each word of the run must exceed the one before it by. 2 finds a table of pointers to consecutive u16s, which is what gSpecialVars is. Accepts 0x hex" = "table-scan 中相邻字的固定差值，支持 0x 十六进制。2 可寻找连续 u16 指针表，例如 gSpecialVars。"
"with --buffer-script table-scan: where to start, 16-byte aligned (default 0x08000000, the cartridge)" = "表扫描起始地址，须按 16 字节对齐；默认 0x08000000。"
"with --flash-derive: added to gSaveCounter for the footer. 0 keeps the sector in its own band; a positive value is what would outrank the live slot" = "写入尾部时加到 gSaveCounter 的偏移。0 保留当前存档区；正值可使其优先于当前存档槽。"
"with --flash-derive: aim at band position N (0..13) and derive the ID from it, instead of deriving the position from --flash-id. Position 13 is the sector whose counter GetSaveValidStatus reports for the whole slot" = "根据存档区内的位置 N（0 至 13）推导 ID，而非根据 --flash-id 推导位置。位置 13 的计数器决定整个存档槽的状态。"
"with --flash-footer: read gLastWrittenSector and gSaveCounter on the console and write the sector the --flash-id actually occupies right now, rather than a position computed when the payload was built. Needs --write-unsafe" = "实时读取 gLastWrittenSector 和 gSaveCounter，定位 --flash-id 当前所在扇区；须启用 --write-unsafe。"
"with --flash-footer: the save counter written at +0xFFC" = "规范扇区在 +0xFFC 写入的存档计数器。"
"with --flash-footer: the sector id written at +0xFF4" = "规范扇区在 +0xFF4 写入的扇区 ID。"
"with --gift event-pokemon: a fresh copy of a Gen 3 distribution, made by PKHeX by that event's\nown PID/IV method, e.g. \"WISHMKR Jirachi\", \"10 ANIV Pikachu\", \"Aura Mew\". The\nrelease in --language is preferred. Without it the card sends a stored WISHMKR Jirachi." = "由 PKHeX 按第三世代活动的 PID／个体值方法生成新副本，例如 WISHMKR Jirachi、10 ANIV Pikachu、Aura Mew。优先匹配 --language；留空则发送预存的 WISHMKR 基拉祈。"
"with --gift event-pokemon: a fresh copy of a Gen 3 distribution, made by PKHeX by that event's own PID/IV method, e.g. \"WISHMKR Jirachi\", \"10 ANIV Pikachu\", \"Aura Mew\". The release in --language is preferred. Without it the card sends a stored WISHMKR Jirachi." = "由 PKHeX 按第三世代活动的 PID／个体值方法生成新副本，例如 WISHMKR Jirachi、10 ANIV Pikachu、Aura Mew。优先匹配 --language；留空则发送预存的 WISHMKR 基拉祈。"
"with --gift rng-mon-hunt: a floor under one IV, repeatable (speed=31, attack=20). The stats\nare hp, attack, defense, speed, sp_attack, sp_defense, named in the order the ROM draws them - which is not the order the summary\nscreen shows." = "个体值的最低要求，可重复指定，例如 speed=31、attack=20。字段为 hp、attack、defense、speed、sp_attack、sp_defense，顺序与游戏摘要页不同。"
"with --gift rng-mon-hunt: a floor under one IV, repeatable (speed=31, attack=20). The stats are hp, attack, defense, speed, sp_attack, sp_defense, named in the order the ROM draws them - which is not the order the summary screen shows." = "个体值的最低要求，可重复指定，例如 speed=31、attack=20。字段为 hp、attack、defense、speed、sp_attack、sp_defense，顺序与游戏摘要页不同。"
"with --gift rng-mon-hunt: how long the search may block the overworld in the worst case,\nin frames (default 900, about 15 s). The field engine has not returned while it\nsearches, so the player sees a still frame with the music playing; criteria whose\nsearch could take longer than this are refused before the card is built." = "随机数搜索允许阻塞地图的最长帧数，默认 900（约 15 秒）。搜索期间画面静止但音乐继续；超出预算的条件会在构建卡片前被拒绝。"
"with --gift rng-mon-hunt: how long the search may block the overworld in the worst case, in frames (default 900, about 15 s). The field engine has not returned while it searches, so the player sees a still frame with the music playing; criteria whose search could take longer than this are refused before the card is built." = "随机数搜索允许阻塞地图的最长帧数，默认 900（约 15 秒）。搜索期间画面静止但音乐继续；超出预算的条件会在构建卡片前被拒绝。"
"with --gift rng-mon-hunt: how many states the stub may try before giving up and leaving the\nrng alone. The default is the smallest cap that finds one 99 times in 100." = "随机数搜索最大尝试次数，达到上限即停止且保留随机数。默认选择能达到 99% 成功率的最小上限。"
"with --gift rng-mon-hunt: how many states the stub may try before giving up and leaving the rng alone. The default is the smallest cap that finds one 99 times in 100." = "随机数搜索最大尝试次数，达到上限即停止且保留随机数。默认选择能达到 99% 成功率的最小上限。"
"with --gift rng-mon-hunt: the level that species appears at." = "随机数搜索礼物中出现的宝可梦等级。"
"with --gift rng-mon-hunt: what the stub's own `setwildbattle` puts on the screen. Neither the\nspecies nor the level is drawn from the rng, so this changes nothing about the\nsearch. The default is a level 5 MAGIKARP, which is catchable in one ball." = "rng-mon-hunt 出现的宝可梦种类；种类及等级不来自随机数，因此不影响搜索。默认等级 5 的鲤鱼王，便于捕获。"
"with --gift rng-mon-hunt: what the stub's own `setwildbattle` puts on the screen. Neither the species nor the level is drawn from the rng, so this changes nothing about the search. The default is a level 5 MAGIKARP, which is catchable in one ball." = "rng-mon-hunt 出现的宝可梦种类；种类及等级不来自随机数，因此不影响搜索。默认等级 5 的鲤鱼王，便于捕获。"
"with --gift rng-mon-hunt: which natures the search will accept, comma separated\n(Hardy, Lonely, Brave, Adamant, Naughty, Bold, ...), or plain ids. Without this it takes any." = "rng-mon-hunt 接受的性格，用逗号分隔的英语名称或 ID；留空则接受所有性格。"
"with --gift rng-mon-hunt: which natures the search will accept, comma separated (Hardy, Lonely, Brave, Adamant, Naughty, Bold, ...), or plain ids. Without this it takes any." = "rng-mon-hunt 接受的性格，用逗号分隔的英语名称或 ID；留空则接受所有性格。"
"with --ip-host, the address to advertise" = "--ip-host 模式下广播的地址。"
"with --ip-host, the address to advertise and serve on" = "--ip-host 的广播及监听地址。"
"with --match-wait, ALSO send NetDataIsMatchWaitData{1} every S seconds for the whole hold (0 disables, leaving the answer-on-request). The console requests 0x23 once, at t=8.4-9.4, and the player reaches the trade option in the Y menu long after that" = "配合 --match-wait，在整个连接期间每隔 S 秒额外发送 isMatchWait=1；0 关闭定期发送，仍按请求回应。"
"with --migrate, ladder done to box command 3 and the migration" = "配合 --migrate，结束步骤推进至盒子命令 3 并迁移主机。"
"with --raid-event: roll each drop's chance as a den does, or give every drop" = "配合 --raid-event 使用：按巢穴规则随机决定各项掉落，或提供全部掉落。"
"with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)" = "配合 --raid-event 使用：将仅限捕获一次的遭遇（所有七星团体战、波荡水、铁斑叶等）改为普通捕获，使用普通捕获规则及替代记录编号，让已捕获过的存档也能再次捕获；无法捕获的遭遇仍不可捕获。详见 docs/sv_raid.md。"
"with --raid-event: the boss, numbered as the list printed without it" = "配合 --raid-event 使用：首领编号；不指定时显示可选首领的编号列表。"
"with --raid-event: the den area whose table the boss comes from" = "配合 --raid-event 使用：首领所用遭遇表对应的巢穴区域。"
"with --raid-event: the star rank, 1 to 5" = "配合 --raid-event 使用：星级，范围为 1 到 5。"
"with --raid-event: whose table the boss comes from; the advertisement's version by default" = "团体战使用的游戏版本：朱或紫。"
"with --save-backup: keep a backup the link cut short here; the next one goes on from it" = "配合 --save-backup 使用：在此保留中断的备份，下次从断点继续。"
"with --selection-offer, answer the console's selection status with our PK8 in field 5 (`body`) of a 40050 Data carrying OUR ownerId, on the RPC port, instead of a PokemonTradeDataHolder on 10050 port 0. Content 50's receive handler resolves the sender to a station index and drops silently when it cannot; the holder shape carries no owner" = "配合 --selection-offer，以含本机 ownerId 的 40050 Data 字段 5 承载 PK8，在 RPC 端口回应选择状态。"
"with --selection-offer, answer the selection status with our PK8 as a PokemonTradeDataHolder on the 20000-base holder (id 20050), which is where the BOX phase's own Pokemon rides one content over. Overrides --selection-offer-mirror and --selection-offer-data" = "配合 --selection-offer，在 20050 的 PokemonTradeDataHolder 上提供 PK8，覆盖 mirror 和 data 形式。"
"with --selection-offer, answer the selection status with our PK8 in a 40050 carrying the console's OWN field set - syncId, clock, body, and neither elementId nor ownerId, which is how its own selection offer decodes. Overrides --selection-offer-data" = "配合 --selection-offer，按游戏机字段布局在 40050 的 syncId、clock、body 中提供 PK8，不含 elementId／ownerId；覆盖 data 形式。"
"with --session-join, re-send it every N seconds (0 sends it once)" = "配合 --session-join，每隔 N 秒重发加入请求；0 表示只发送一次。"
"with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)" = "配合 --spawn 使用：仅当主机位于 PKHeX 判定捕获合法的区域时生成。区域由主机游戏机共享的野生宝可梦推断；我方玩家靠近后才会共享，可配合 --follow-host 使用。"
"with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP" = "配合 --union-circle 使用：任务完成后离开集友圈并结束运行。snacksworth 在开场演出结束后每秒完成一项集友或个人任务，补齐点心大叔全部传说的宝可梦所需次数；bp 完成一项任务，向主机发放 --bbq-clear 指定的 BP。"
"with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it" = "配合 --union-circle 使用：开场演出结束 10 秒后，在主机玩家周围 15 到 25 米处保持 3 只此种类的野生宝可梦（开发编号）。主机与其对战、移除或离开超过 50 米后，宝可梦会在附近重新生成。"
"with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it" = "配合 --union-circle 使用：我方玩家跟随主机的移动、动画及骑乘状态，保持 5 米距离并面向主机。"
"with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way" = "配合 --union-circle 使用：打印每条发出的集友圈消息及区域搜索的各个步骤；无论是否启用，--capture 文件都会保存这些步骤。"
"with a dumping --buffer-script: write the bytes that come back to this file" = "将读取返回的数据保存到此文件。"
"worlds-xp" = "世界锦标赛 XP"
"write an annotated listing for the exact Mystery Gift bytes that will be sent (default: disabled)" = "控制是否为实际发送的神秘礼物字节生成带注释清单，默认关闭。"
"write every datagram here as JSON lines" = "将所有数据报保存到此 JSONL 文件。"
"write every record the console showed or offered to this directory" = "将游戏机显示或提供的每个记录保存到此目录。"
"write every record the console shows or offers to this directory, one file per distinct record, named by species and nickname" = "将对方显示或提供的所有不同记录保存到此目录，按种类及昵称命名。"
"write the .sav FILE onto the console: beside its newest save, every sector read back, then the game loads it and saves; anything short of that keeps the old save" = "将 .sav 文件写入游戏机，逐扇区读取校验后加载并保存；失败时保留旧存档。"
"write the PK8 the console offers to this file; trade N > 1 writes FILE-N" = "将游戏机提供的 PK8 保存到此文件；第 N 次交换（N > 1）写入 FILE-N。"
"write the PK8 we will offer to this file, before the radio is touched" = "在使用开发板前，将将要提供的 PK8 保存到此文件。"
"write the Pokemon the console offers in trade N to PREFIX_N.pb8" = "将第 N 次交换中对方宝可梦保存为 PREFIX_N.pb8。"
"write the Pokemon the console picks here; trade N > 1 writes FILE-N. A preview, the console's cursor on its box, is not written" = "保存游戏机最终选择的宝可梦，第 N 次（N > 1）写入 FILE-N；不保存仅用于预览的盒子光标记录。"
"write the host's offered PA9 here; trade N > 1 writes FILE-N" = "保存主机提供的 PA9，第 N 次（N > 1）写入 FILE-N。"
"write the joiner's Pokemon here; trade N > 1 writes FILE-N" = "保存加入方宝可梦的路径；第 N 次交换（N > 1）写入 FILE-N。"
"write the offered record's 348-byte body to this file as hex and exit, which needs no radio" = "以十六进制导出将提供的 348 字节记录并退出，无需开发板。"
"write the peer's offered PB7 here" = "将对方提供的 PB7 宝可梦保存到此路径。"
"write the record and its fragments here and exit" = "将记录及其片段写入此目录，然后退出。"
"write the record the console traded to this file" = "将游戏机交换给本机的记录保存到此文件。"
"write the record the console traded to this file, -N before the extension for trade N above 1" = "将交换收到的记录保存到此文件；第 N 次在扩展名前加 -N。"
"x2 slower" = "减速至 1/2"
"x2, x3 or x4 in the overworld and in battle, and faster text." = "地图和对战采用两倍、三倍或四倍速，并加快文字显示。"
"x4 slower" = "减速至 1/4"
"x8 slower" = "减速至 1/8"
"zero" = "零"
"zstd-compress out payloads" = "使用 zstd 压缩输出数据。"
"{PLAYER} is the player's name. A box holds two lines." = "{PLAYER} 代表玩家名字。每个文本框容纳两行。"
"· egg" = "· 蛋"
"· queue full" = "· 队列已满"
