"offer" = "提供"
"offer a record of the host's own rather than the captured one: the same Pokemon under the data exchange's player name and id and a new identity, so the console is not offered the record it is itself holding" = "使用本机身份而非捕获身份提供记录，替换名称、ID 及标识，避免返还对方自身已有记录。"
"offer back the exact PK8 the console just offered us, unchanged, instead of one out of --send-snapshot. These bytes came out of its own save, so a run that still aborts rules the record out" = "原样返还游戏机刚提供的 PK8，替代快照记录，以排除宝可梦数据本身导致失败的可能。"
"offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "为每个提供记录生成新 PID 及加密常量，保留异色状态，使存档可再次接收。"
"offer every --offer and --next-offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "为 --offer 和 --next-offer 生成新 PID 和加密常量，保留异色状态，使已接收过的存档可再次接收。"
"offer every --offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "为每个 --offer 生成新 PID 和加密常量，保留异色状态，使存档可再次接收。"
"offer it under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again" = "生成新 PID 及加密常量，保留异色状态，使已接收过的存档可再次接收。"
"offer the host's own Pokemon on the game channel: answer the console's trade box with one of ours at sequence 2 on port 0" = "在游戏通道提供本机宝可梦，用端口 0 序列 2 回应对方交换盒子。"
"offer the record under a new PID and encryption constant, drawn once per run, shiny state kept, so a save that took it before takes it again" = "每次运行生成新 PID 及加密常量，保留异色状态，使已接收过的存档可再次接收。"
"offer this record file instead of the reference one; stored or party, encrypted or decrypted. Repeatable, one per trade in order; the last is offered again after the list" = "替代参考记录的文件，支持盒子／队伍、加密／已解密格式。可重复指定，依次使用，最后一个用于后续交换。"
"offline: replay a capture's host stream" = "离线回放捕获记录中的主机数据流。"
"on_received called with no recv in flight" = "没有正在接收的数据时调用了 on_received"
"on_sent called with no send in flight" = "没有正在发送的数据时调用了 on_sent"
"once a hash body has been answered, `ping` content N's 10000-base holder on port 0 to open the next phase - 40 is the confirmation, so this sends `382700000a00`. The console stops sending 40050 once the hash answer lands and says nothing further; Pia retransmits anything it still waits on, so that silence means satisfied and the next phase needs opening" = "哈希回应后，在端口 0 向内容 N 的 10000 基址 holder 发送 ping，尝试打开下一阶段；40 为确认阶段。"
"once a hash body has been answered, open content N's phase by sending the two-member RPC pair for it (40 is the confirmation). A pair is the only shape that opens a phase on this console: 40030 opened the offer and 40050 the selection. A bare content ping (`382700000a00`) and a bare sync-120 ping (`780000000a00`) are both ignored" = "哈希回应后发送内容 N 的双成员 RPC 对以打开其阶段；40 为确认阶段。"
"once a hash body has been answered, send `ping` on sync holder N (120 is the confirmation's) on port 0. The console drives 97, 60000, 110 and 130 itself and opens the selection phase when 130's pingSynced lands; it never sends 120. A phase follows its sync, not a content ping" = "哈希回应后，在端口 0 的同步 holder N 发送 ping；120 为确认阶段同步。"
"once in the mesh, do not answer the host's RTT requests and send none of our own. Default: answer them and send one a second" = "加入网络后不回应主机 RTT，也不发送本机 RTT；默认回应并每秒发送一次。"
"once in the mesh, do not run the Sync Clock Protocol (0x1c): a request every 2 s, the host's reply carrying the mesh clock in ms. Default: run it" = "加入网络后不运行同步时钟协议 0x1c；默认每两秒请求一次主机毫秒时钟。"
"once in the mesh, do not run the clone clock exchange (requests every 0.2 s, replies with our ms clock, participate after ten answers: docs/lgpe_session.md). Default: run it" = "加入网络后不运行克隆时钟交换；默认每 0.2 秒请求一次，收到十次响应后参与。"
"once joined, echo RTT and acknowledge the reliable stream so the console does not time out after 12 s and leave" = "加入后回显 RTT 并确认可靠流，避免游戏机在十二秒后超时离开。"
"once the confirmation ladder has produced its first step, end the run as soon as SECONDS pass with no NEW step body: stop transmitting, drop the link and let the console report a lost connection. Holding a stalled ladder open with acks instead makes the game declare the TRADE failed, which costs the player about an hour. Nothing but acks follows the last step body. 0 is off and the hold runs in full." = "确认流程开始后，若此秒数内未出现新步骤则停止发送并断开，使游戏机报告连接丢失。0 表示关闭。长时间保持卡住的流程可能使游戏判定交换失败并限制交换。"
"once the mesh is running, send one Atomic (0x74) kind-0 announce; a probe for whether a host announce fills an element slot (report 163)" = "网络建立后发送一次 Atomic（0x74）类型 0 公告，探测主机公告是否创建元素槽。"
"once the migration makes us the host, broadcast UPDATE_MESH the way the console did: its own last one with the host index set to ours. The console stops sending these once it hands the role over, and the mesh is gone about 1.3 s later if nothing takes over" = "迁移后本机成为主机时，广播主机索引改为本机的 UPDATE_MESH，维持网络。"
"once the session is up, open the game's reliable streams and send the identity, the selection record and, with --trade-offer, an offer" = "会话建立后打开游戏可靠流并发送身份、选择记录；指定 --trade-offer 时还会提供宝可梦。"
"only a script that opens with the standard game-data prefix can be gated" = "只有以标准游戏数据前缀开头的脚本才能附加条件检查"
"only join a console waiting on this link code" = "仅加入等待此连接密码的游戏机。"
"only the broadcast pass, the framing the ack proved" = "仅执行广播测试。"
"only the unicast pass, skipping the broadcast one" = "仅执行单播测试，跳过广播。"
