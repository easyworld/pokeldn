"how long to stay in one joined session before scanning again" = "单次连接保持多久后重新扫描。"
"how long to wait for the scan response and the sync" = "等待扫描响应及同步的最长时长。"
"how long to wait for the station acceptance before giving up on joining" = "等待站点接受的最长时长。"
