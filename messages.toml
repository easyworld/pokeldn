"Wonder News payload to distribute (Mystery Gift -> Wonder News -> Friend). Available news: pokeldn id 1: the plain proof-of-link news, one berry from the man in CERULEAN CITY berry id 2: a ten-line news that exercises the console's scroll indicator" = "要分发的神奇新闻，通过“神秘礼物 → 神奇新闻 → 朋友”接收。pokeldn 为连接验证新闻，可在华蓝市领取树果；berry 为十行滚动新闻。"
