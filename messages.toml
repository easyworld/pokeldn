"run native ARM code on the console through CLI_RUN_BUFFER_SCRIPT instead of sending a gift: trainer-id-probe: read playerTrainerId out of gSaveBlock2Ptr and return it (reads only, writes nothing); save-dump: read out any part of either save block, using the pointers the console hands us - no absolute address needed (reads only, writes nothing); memory-dump: read out any region of the console's memory by repointing the console's own outgoing message at it (needs --dump-address; reads only, writes nothing); memory-dump-multi: the same, but SEVERAL consecutive blocks in one session (--dump-address --dump-blocks N): the client script runs the payload once per block and each pass sends the next kilobyte; memory-dump-scatter: the same, but the blocks are UNRELATED addresses (--dump-scatter A,B,C): the payload carries a table of bases and the cursor indexes it, so one session reads the sixteen kilobytes a plan actually asked for rather than sixteen consecutive ones; save-write: write bytes into a save block and read the same region back in the same run; the console saves afterwards, so the write reaches flash (--write-hex, --dump-block, --dump-offset); rng-trace: sample one word of memory once a frame, optionally calling a ROM function between the two halves of each sample, and check the LCG recurrence on what comes back (--trace-address, --trace-call, --trace-samples; reads only, plus whatever the callee does); memory-scan: search memory for a 32-bit value and send back where it is; it returns 0 to be called again next frame, so one run covers a range no dump could (--scan-word, --scan-start, --scan-end, --scan-blocks; reads only, writes nothing); table-scan: search memory for a table by its shape, a run of N words each exactly D above the one before it, and send back where each run starts and what value it starts with; this is how a table of pointers is found when no constant in it is known (--table-delta, --table-runlen, --table-start, --table-end, --table-blocks; reads only, writes nothing); rom-checksum: checksum a range of memory in up to 128 blocks and send back one sum per block; the host sets them beside the same sums over a ROM image and names the blocks that differ (--sum-start, --sum-end, --sum-block, --sum-budget, --sum-reference; reads only, writes nothing); anchors: ask the machine where it is: our own load address, the return address into ROM, the stack and the client's five buffers (writes only its own outgoing buffer); create-mon: call CreateMon, a ROM function taking eight arguments, and send back the 100-byte struct Pokemon it built; the mon is built inside our own image, so nothing on the console is written unless --create-mon-append or --create-mon-destination asks for it (--create-mon-call, --create-mon-species, --create-mon-level, --create-mon-personality); string-gather: follow an array of pointers and send back the strings themselves, back to back, instead of a window of mostly-pointers: a whole Easy Chat group in one run (--gather-address, --gather-count, --gather-stride; reads only, writes nothing); call: call any ROM function with arguments we choose, up to eight words in r0..r3 then the stack, and send back its r0 with one address read either side of the call (--call-address, --call-arg, --call-watch); the payload writes nothing itself, but the callee may, so the address has to have been read as code first; flash-read: select the flash bank, byte-copy a save sector out of the 64 KiB window into EWRAM with the CPU, and send the COPY: the console's outgoing message cannot be pointed at flash itself (--flash-sector, --flash-read-offset, --dump-size; reads only, writes nothing); flash-patch: read a save sector out of flash through the banked window, change one field, recompute the checksum and write it back with swi 0x48, then bump the counter-bearing sector so the loader adopts the band. Nothing is rebuilt from RAM, so a field the save routine serializes cannot be lost (--flash-id, --flash-patch-offset, --flash-patch-hex; needs --write-unsafe); flash-write: compose 4 KB in EWRAM on the console and write it straight into a flash sector with swi 0x48, bypassing the game's save code entirely - no counter, checksum or signature (--flash-sector, --flash-fill-base, --flash-fill-step, --flash-words; a sector inside the save bands needs --write-unsafe); call-chain: run a LIST of ROM calls and memory accesses in one frame and send back a word for each, any step able to use the previous step's result as its address - which is how a function that returns a pointer (GetVarPointer) becomes a write (--chain-step, repeatable; a write step needs --write-unsafe); sloop-svc: issue one Sloop syscall (swi 0x40..0x62) with r0..r3 we choose, optionally pointing r0 or r1 at up to 256 bytes we send, and send back the registers and the bytes as the syscall left them (--svc-number, --svc-arg, --svc-text/--svc-hex, --svc-data-in; a number outside the read-only set needs --write-unsafe); install-resident: copy a resident hook into the top of EWRAM and install it in gIntrTable[4], where it runs every frame until a soft reset; answers with the V-blank handler it found (--resident turbo, --resident-param extra=N field=N battle=N hold=0x100 budget=228; needs --write-unsafe); install-kept: install the resident hook kept in the save's filler_B20 (written by save-write --resident), after checking its sum; answers with the V-blank handler it found, 0xBAD0BAD0 when nothing was installed" = "通过 CLI_RUN_BUFFER_SCRIPT 在游戏机运行原生 ARM 代码，替代礼物发送。支持存档／内存读取、存档写入、随机数追踪、内存／表扫描、ROM 校验、函数调用、宝可梦创建及常驻增强等脚本；按所选脚本配置下方参数。写入类操作须启用 --write-unsafe。"
