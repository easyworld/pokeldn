"`ping` content N's 10000-base holder at the 0x84 snapshot ack, before either side offers. The console's box send is gated on a ready bool at content+0x4c that only `0x010ce040` sets, on a zero result code; until then every command the game tries to send is parked in content+0x48. A parked command that does not match the next one sets the error byte +0x4d, and `0x010c9bb0` turns that into trade state 9: abort, with nothing on the application layer" = "0x84 快照得到确认时，在双方提议前向内容 N 的 10000 基址 holder 发送 ping。"
"a .pk8 to put in --offer-slot in place of the snapshot's record: stored or party form, encrypted or PKHeX's decrypted export. Its OT name and ids become the snapshot's unless --offer-file-as-is. Repeatable, one per trade on the session: the console's player picks again from the box; the last serves every later trade" = "替换快照指定位置的 .pk8，支持盒子／队伍、加密／已解密格式。默认改用快照的初训家名称及 ID；可用 --offer-file-as-is 保留。可重复指定，最后一个用于后续交换。"
"a .pokegift or 720-byte .wc8 record to send instead of building one" = "发送现有 .pokegift 或 720 字节 .wc8 文件，替代构建新记录。"
"a 3456-byte trade snapshot to send back on 0x84 once the console sends its own, or live (the default under --preset trade) for the console's own from this session. A short 2965-byte payload is inflated first. The identity is rewritten by --snapshot-name/-tid/-sid" = "收到对方快照后，在 0x84 发送此 3456 字节交换快照；live 使用当前会话游戏机快照。2965 字节短数据会先扩展；身份可由 --snapshot-name/-tid/-sid 重写。"
"a 354-byte offer message to send once the streams are open. Repeatable, one per trade in the seat; the last serves every later trade" = "流打开后发送的 354 字节提议消息，可重复指定，依次交换；最后一个用于后续交换。"
"a Dynamax Adventure (Max Lair) guest: the lobby, the paths and the battles; use with --scene 50000" = "作为极巨大冒险（极巨巢穴）访客，参与大厅、路线及战斗；配合 --scene 50000 使用。"
"a Max Raid den guest: after the snapshot send PlayerInfo, BattleReady and SelectPokemon (the --offer-slot Pokemon); use with --scene 60006" = "作为极巨团体战巢穴访客：收到快照后发送 PlayerInfo、BattleReady 和 SelectPokemon（--offer-slot 指定的宝可梦）；配合 --scene 60006 使用。"
"a Mystery Event cannot share a session with a stamp rally or a visiting trainer" = "神秘活动不能与集章活动或来访训练家共用一次会话"
"a Mystery Event script cannot share a session with news, a stamp rally or a visiting trainer" = "神秘活动脚本不能与新闻、集章活动或来访训练家共用一次会话"
"a Mystery Gift distribution needs a card and a RAM script" = "神秘礼物分发需要卡片和 RAM 脚本"
"a Mystery Gift session needs a Wonder Card and RAM script, or news, or a buffer script" = "神秘礼物会话需要神奇卡片和 RAM 脚本，或新闻，或缓冲区脚本"
"a PB8 to offer (328 or 344 bytes, encrypted or PKHeX's decrypted export), edited by --trade-nickname and --trade-ot. 328 bytes hold much more than this project has identified, so what we send is a real Pokemon with named fields changed rather than one invented from nothing. Repeatable, one per trade in order; the last is offered again after the list" = "提供的 PB8，支持 328／344 字节、加密／PKHeX 已解密格式，可由 --trade-nickname 和 --trade-ot 修改。可重复指定，依次交换，最后一个用于后续交换。"
"a PK8 to place in the offered party slot, encrypted or PKHeX export. Repeatable, one per trade: the player trades again from the box, or searches again; the last serves every later trade" = "放入交换队伍位置的 PK8 文件，支持加密或 PKHeX 导出格式。可重复指定，依次交换；最后一个用于后续交换。"
"a SECOND stream, on --send2-protocol, sent once the console says --send2-trigger. `60ea000012020801` is BlockDataHolder{imReady:true}, which the console says on 0x80 and waits on" = "在 --send2-protocol 上发送第二条流，触发条件为 --send2-trigger；60ea000012020801 表示 BlockDataHolder 已就绪。"
"a Wonder News distribution carries no card or RAM script" = "神奇新闻分发不能包含卡片或 RAM 脚本"
"a Wonder News session carries no Wonder Card and no RAM script" = "神奇新闻会话不能包含神奇卡片或 RAM 脚本"
"a buffer script cannot share a session with news, a stamp, a visiting trainer or a Mystery Event script" = "缓冲区脚本不能与新闻、印章、来访训练家或神秘活动脚本共用一次会话"
"a buffer script distribution carries no card or RAM script" = "缓冲区脚本分发不能包含卡片或 RAM 脚本"
"a buffer script runs on its own: no card, news, stamp rally, visiting trainer or Mystery Event script in the same session" = "缓冲区脚本必须单独运行，不能在同一次会话中包含卡片、新闻、集章活动、来访训练家或神秘活动脚本"
"a comma-separated list of ids to probe instead" = "改为探测指定 ID 列表，用逗号分隔。"
"a complete FRLG .pokegift file, or a .wc3 Wonder Card" = "完整的火红／叶绿 .pokegift 文件，或 .wc3 神奇卡片。"
"a controller for the Switch" = "Switch 手柄"
"a directory of NNN.bin records to send on 0x81 port 0 as this host's own identity, the way a pair's host sends its 46; the first carries INITIALIZED and every one is already zlib (scratchpad/sv_extract_records.py writes such a set); by default the recorded set in pokeldn.sv.reference" = "本机身份记录目录，包含 NNN.bin，在 0x81 端口 0 发送；首条带 INITIALIZED，各记录已 zlib 压缩。默认使用 pokeldn.sv.reference。"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "按 pokeldn.sv.pokemon 字段名修改提供记录，例如 nickname=SHINY、species=906、ivs=31,31,31,31,31,31、trainer_id=12345、ball=4；单独 shiny 按记录 ID 生成异色 PID。"
"a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids" = "封装前按 pokeldn.sv.pokemon 字段名修改记录，例如 nickname=SHINY、species=906、level=50、ivs=31,31,31,31,31,31、ball=4；可重复指定，单独 shiny 会按记录 ID 生成异色 PID。"
"a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "本机提供的 348 字节记录文件，支持原始字节或十六进制文本，352 字节消息会去除头部。可重复指定，依次完成提议、确认及提交后的四步交换。"
"a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes" = "加入方提供的 348 字节记录文件，支持原始或十六进制，352 字节消息会剥离头部。可重复指定，依次回应提议、确认、提交并完成四步交换。"
"a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon" = "将游戏机自身提议的 348 字节消息体保存为十六进制文本，可用 pokeldn.sv.pokemon 读取。"
"a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text" = "将主机提供的 348 字节消息体保存为十六进制文本。"
"a file to write the moment a seat forms and again when it ends, so a watcher on the other side can act on the seat without a relay" = "连接建立及结束时写入此标记文件，供另一侧监视程序判断状态。"
"a game message to put on the reliable stream before the first --request-ids request, e.g. 0x59:01000100 to add station 1 to the console's match-wait list. Repeatable, sent in order" = "首个 --request-ids 请求前，在可靠流依次发送这些游戏消息，例如 0x59:01000100；可重复指定。"
"a level the game rolls" = "等级由游戏随机决定"
"a memory dump needs the payload that repoints the send" = "读取内存需要重新指定发送地址的载荷"
"a protocol id the console does not register, so its version is 0" = "游戏机未注册的协议 ID，其版本为 0。"
"a reward row in place of the seed's, in order; up to 45" = "按顺序替换种子默认奖励的奖励行，最多 45 项。"
"a reward row, item id and count; up to 15; none gives an emulated den's rows" = "奖励行，包含道具 ID 和数量，最多 15 行；不指定时使用模拟巢穴的奖励。"
"a ribbon index; repeatable" = "奖章索引，可重复指定。"
"a save session either backs up or restores" = "一次存档任务只能执行备份或恢复"
"a searching console put both of its measured sessions on channel 6" = "无线信道；参考搜索游戏机的两次实测连接均使用 6。"
"a stamp must be exactly four bytes" = "印章必须恰好为四个字节"
"a stamp rally and a visiting trainer cannot share one session" = "集章活动与来访训练家不能共用一次会话"
"a standard or a black (six-star) crystal" = "普通结晶或黑色结晶（6 星）。"
"a trainer" = "一位训练家"
"ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)" = "特性位置，2 为隐藏特性；默认按野生宝可梦规则随机选择 0 或 1。"
"ability-capsule" = "特性胶囊"
"accept hardware-decrypted RX frames that retain their CCMP header and mic (TP-Link Archer T3U/rtw88_8822bu profile)" = "控制是否接受硬件已解密但仍保留 CCMP 头和 MIC 的接收帧，适用于 Archer T3U／rtw88_8822bu。"
"accept without waiting for the joiner's acceptance, as a player would; for our own joiner, which accepts after its partner" = "无需等待加入方同意即主动接受，模拟玩家操作；用于等待交换对象先同意的本机加入程序。"
"ack one past the highest id received, with no mask, instead of the contiguous run and a mask as a retail station does (docs/sv.md)" = "确认最高已收 ID 加一，不使用掩码；默认使用实机连续区间及掩码方式。"
"ack the mesh join response, on the STATION protocol" = "在 STATION 协议确认网络加入响应。"
"acknowledge a record already held at most once per SECONDS per stream; a new record is acked at once. 0 acks every repeat (docs/sv.md)" = "已持有记录在每条流上的最短重复确认间隔；新记录立即确认，0 表示每次重复都确认。"
"acknowledge the 0x7C reliable window. The pass signal is the retransmits STOPPING and the sequence ids moving on" = "确认 0x7c 可靠窗口；成功表现为停止重传且序列 ID 前进。"
"acknowledge the console's reliable data as it arrives" = "收到对方可靠数据时自动确认。"
"act as the player too: offer once the host shows, confirm once it offers, then selector 7; without it the console's player leads" = "模拟玩家主动操作：主机显示后提议，对方提议后确认，再发送选择器 7；未启用则由对方玩家引导。"
"address our datagrams to the host rather than to the broadcast" = "将数据报单播到主机，替代广播。"
"address our datagrams to the link-local broadcast, as a retail station does" = "将数据报发往链路本地广播地址，与实机站点行为一致。"
"address our own clone announce to the peer alone. A real joiner addresses the first announce of a clone to the whole mesh (dest 0x0003), which is the default here" = "仅向对方发送本机克隆公告；默认向整个网络发送（目标 0x0003）。"
"advertise 0x00, hex; a searching Sword joins only a larger one than its own; default 0xFFFF and two random bytes" = "覆盖广播 0x00 字段（十六进制）。剑版仅加入大于自身值的广播；默认 0xFFFF 加两个随机字节。"
"advertise Violet's local communication id instead of Scarlet's" = "广播紫版的本地通信 ID，替代朱版。"
"advertise this local communication id" = "广播指定的本地通信 ID。"
"after THEY answer our approach, send this message - the initiator's own next one. `0x06:0000000000` is NetDataTalkData{sexId 0, CHECK}, which is what SwitchTalkStateMine builds. Repeatable, sent in order" = "对方回应靠近后，依次发送这些游戏消息，可重复指定。例如 0x06:0000000000 为 NetDataTalkData 检查。"
"after answering an RPC pair, send BOTH members again with the clock advanced by this much. The console advances its own pair's clock by 2 each burst (b41c, b61c, b81c). A repeated clock is a repeated state, so an answer that carries one clock never moves ours. 0 is off" = "回应 RPC 对后，将两个成员的时钟按此值增加并重发；游戏机每次增加 2，0 表示关闭。"
"after answering phase 3, wait for the console's phase 6, then leave without answering it; this deliberately triggers the game's trade restriction" = "回应阶段 3 后，收到阶段 6 时不回应直接离开；此测试会触发游戏交换限制。"
"after answering the talk reservation, send this game message on the reliable stream - `0x08:00` is NetDataSelectData{index: 0}. Repeatable, sent in order. The console parks in TalkState GREETING and waits to be advanced, and which message does it is not readable offline: this is the sweep handle" = "回应聊天预约后，在可靠流依次发送这些游戏消息，可重复指定。例如 0x08:00 表示选择索引 0。"
"after identifying, vary the variable id to find what result 7 tests" = "识别后改变可变 ID，以研究结果 7 的检查条件。"
"after our offer is acknowledged, send `ping` on content N's 10000-base holder for each N - `382700000a00` for 40, which is exactly the opener nxldn-lab's client sends to start the confirmation phase, rebuilt here from our own content registry rather than copied" = "提议获确认后，为各内容 N 在 10000 基址 holder 上发送 ping，触发确认阶段。"
"after our offer is acknowledged, send boxSyncStateCommand{data:N} on the trade holder for each N in turn, one per acknowledged sequence. 20030 is a BoxSyncStateDataHolder and its field 2 is a command enum; this project 1 offers and 2 withdraws; 4 confirms and 5 withdraws the confirmation" = "本机提议获确认后，在交换 holder 逐条发送 boxSyncStateCommand：1 提议，2 撤回，4 确认，5 撤回确认。"
"after our offer is acknowledged, send imReady on the TRADE holder (20030). The console has never sent these bytes and the published client waits for them before it offers, so it may be our turn to say them" = "本机提议获确认后，在交换 holder（20030）上发送 imReady，尝试触发对方提议。"
"after the CONFIRMATION content answers our syncCommand with a hash, re-arm the 40040 pair and send BOTH members again at this clock delta - the move --selection-final-delta makes on 40050, which carries the selection phase past its own hash" = "确认内容返回哈希后，重新启用 40040 消息对，并按此时钟增量重发两个成员。"
"after the ack, sweep the version-4 connection request on protocol 0x14" = "确认后，在协议 0x14 上遍历版本 4 连接请求。"
"after the count, read each candidate protocol's registered version" = "获得数量后，读取各候选协议注册的版本。"
"after the join, sweep the bulk acknowledgement until the console's reliable retransmission stops" = "加入后遍历批量确认参数，直到对方可靠消息停止重传。"
"after the reliable handshake, send N position messages of our own and watch the console's screen" = "可靠握手后发送 N 个本机位置消息，观察游戏机画面。"
"after the response, send a type-5 station-list update (sets job+0x7c). Its per-station layout is provisional pending the 0x739050 decode" = "响应后发送类型 5 站点列表更新；每站布局仍为研究中的暂定格式。"
"after the seat, send this 1395-byte identity record on 0x81 port 1 (our station stream) as the game's data exchange, retransmitting until the host acknowledges it. A retail joiner sends its own identity here" = "连接后在 0x81 端口 1 发送此 1395 字节身份记录，并重传至主机确认。"
"after the selection HASH is answered, send the 40050 pair AGAIN - both members - at this clock delta. nxldn-lab's `selection_final_delta` is 9 (nxldn-lab's `selection_final_delta`). --rpc-pair latches per envelope, so the second pair needs the latch cleared. 0 is off" = "选择阶段哈希得到回应后，按此时钟增量重新发送完整的 40050 消息对；参考值 9，0 表示关闭。"
"after the station handshake closes, send the Mesh Protocol (0x18) join request and ack whatever comes back" = "站点握手完成后发送 Mesh 协议 0x18 加入请求，并确认响应。"
"after the station handshake, send up to N mesh join requests" = "站点握手后，最多发送 N 个网络加入请求。"
"after the walk, send a NetDataTranerCardData for our own station. It is the message that says what a player LOOKS like, and the probe is whether the character the game drew for us changes on screen" = "行走后发送本机训练家卡 NetDataTranerCardData，用于观察角色外观是否更新。"
"after the walk, send a NetRequestData for each of these data ids, one at a time on the reliable stream, and print what comes back. The Union Room answers six ids (docs/bdsp_protocol.md); 0x22 is the opaque one" = "行走后在可靠流逐个请求这些数据 ID，并显示响应；联合房间回应六种 ID。"
"ageto-celebi" = "AGETO 时拉比"
"all" = "全部"
"all the time" = "持续"
"allow a save write outside struct SaveBlock2's never-read filler regions. This is the player's live save and the console commits it to flash; without this the write is refused" = "允许写入 SaveBlock2 未使用填充区以外的真实存档区域。游戏机会将修改保存至闪存；未启用则拒绝写入。"
"alpha" = "头目"
"also send a station list in the same breath as the join response, under this sequence id; an emulated Scarlet host sends one with id 0 there and the second about two seconds later" = "加入响应同时额外发送此序列 ID 的站点列表；模拟朱版主机先发 0，约两秒后发第二条。"
"also send an RTT request, which a peer answers with no state at all" = "额外发送 RTT 请求，对方无需会话状态即可回应。"
"altering-cave" = "变化洞窟"
"an NPC partner the raid seats, in slot order, one per slot the consoles leave empty (2 with one console, 1 with two, none with three): Austin, Ava, Logan, Hailey, Evan, Charlotte, Kylie, Hunter, Gianna, Eli, Henry, Chase, Claire, Brooklyn, Zoe, Samantha, Dylan, Luke; the host draws a partner seed that seats them, the rest drawn freely (docs/sv_raid.md, Partners)" = "按空位顺序指定 NPC 搭档：一台游戏机可指定两名，两台可指定一名，三台没有空位。主机寻找对应搭档种子，其余搭档随机安排。详见 docs/sv_raid.md。"
"an encrypted party PK8 sent as our rental instead of the offered one" = "发送此加密队伍 PK8 作为我方租借宝可梦，替代提供的租借宝可梦。"
"an older controller service holds the Bluetooth link; quit every pokeldn window and open the app again" = "旧版本手柄服务占用了蓝牙连接，请关闭所有 pokeldn 窗口后重新打开应用"
"an unknown date" = "未知日期"
"anchors" = "锚点"
"announce our own channel table on 0x7c. A station opens the game's channel by sending the same 31-byte table its peer sends on port 1, an open on port 2, and a mirror of every later table update; the peer sends the game on port 0 only once ours is announced (docs/sv.md)" = "在 0x7c 公告本机通道表、端口 2 打开及后续更新，使对方可在端口 0 发送游戏数据。"
"answer NetDataTradeReadyOkData (0x21) with tradeState=WAIT and LET THE TRADE COMPLETE. THIS WRITES THE CONSOLE'S SAVE: the message is the only writer of the console's `targetTradeState`, both states at WAIT move UnionTradeManager to SECURIY_TRADE, and TradeStateModel$$InitState calls PlayerSave. The Pokemon the player picked leaves their box and ours takes its place. Needs --trade-reply. ASK THE USER FIRST" = "以 tradeState=WAIT 回应 NetDataTradeReadyOkData（0x21），允许交换完成并写入游戏机存档，对方所选宝可梦将被本机宝可梦替换。需要 --trade-reply。"
"answer a NetDataTalkReserveData with a NetDataTalkReserveResultData. unanswered, the player's character freezes" = "以 NetDataTalkReserveResultData 回应聊天预约；不回应时对方角色可能卡住。"
"answer a connection request the CONSOLE sends us with a connection response" = "用连接响应回答游戏机发来的连接请求。"
"answer a peer re-announcement with an acknowledgement carrying its clock rather than a second take-over. A reference joiner takes a clone over once and never again" = "对方再次公告时，以携带其时钟的确认回应，而非再次接管克隆对象。"
"answer clone clock requests, if any" = "回应克隆时钟请求（如有）。"
"answer each RTT request SECONDS late; RTT samples enable the host's retransmission timer (docs/sv.md)" = "延迟多少秒回应 RTT 请求；RTT 样本用于主机重传定时器。"
"answer each payload the console sends ONCE instead of re-deriving an answer to its last payload every period. `said` never clears, so without this an offer goes out hundreds of times. The console sends each of its own messages once" = "对游戏机每个载荷仅回应一次，避免每个周期都重复发送最后一个回应。"
"answer every DISTINCT (envelope, base, field-5 body) in the 40000 band once, on top of the opening pair. The clock advances on every message so the payload cannot be the key, but the body can: `00000000` and `000018fc` are the openers and anything else is new. A per-envelope guard stops answering at the hash body and stalls there" = "除开场消息对之外，对 40000 区间每个不同的信封、基址及字段 5 消息体组合各回应一次。"
"answer only the first of a peer's repeated publishes with a copy of our own and acknowledge the rest. Measured to stop the peer publishing at all, so the default answers each one" = "仅对对方第一次重复发布回应本机副本，其余仅确认。实测可能使对方停止发布，默认每次都回应。"
"answer the confirmation content's four-byte steps with phase N in the LOW u16 instead of echoing the console's own. The console reads its phase out of exactly those bytes (`0x006d6490` stores them, `0x006d3260` reads them), and every step this project has sent so far echoed the value back unchanged" = "以低 16 位中的阶段 N 回应确认内容的四字节步骤，替代回显游戏机原值。"
"answer the console's 0x58 RTT requests. Sixteen bytes at version 4, and the reply echoes the seven bytes nothing has read yet" = "回应版本 4、16 字节的 0x58 RTT 请求，并回显其中七字节。"
"answer the console's 40030 RPC as the PAIR it is: collect both members one per base, 10000 then 20000, keyed on the BASE FIELD. `payload[5] in (0x19, 0x1A)` is the inner length and moves with the sender's station-id varint (0x1A/0x1B on some consoles). Send both once in that order and nothing more on this window; `said_by_port` keeps only the last payload, so a mirror sends one member repeatedly and never the other" = "按基址收集 40030 RPC 的两个成员，依次发送 10000、20000 成员各一次，避免只重复最后一条消息。"
"answer the console's MIGRATION_START on 0x18 port 1 with a MIGRATION_RESPONSE. `440001` arrives there only when the player accepts, and the console goes silent on every window afterwards: the last thing it asks for is two bytes of mesh, not application data" = "用 MIGRATION_RESPONSE 回应 0x18 端口 1 的 MIGRATION_START；玩家接受后游戏机会在此请求网络迁移。"
"answer the console's NetDataReturnSelectData, a round reset, ONCE; the answer has no measured effect" = "仅回应一次 NetDataReturnSelectData 轮次重置，实测回应无明显效果。"
"answer the console's NetRequestData with the message it names. It has asked for data id 0x23 in every capture since the first join and has never been answered; this is the probe, so arm it on its own" = "按游戏机 NetRequestData 中指定的数据 ID 回应相应消息。"
"answer the console's RTT requests (protocol 0x58) while we hold the seat" = "保持连接时回应对方协议 0x58 的 RTT 请求。"
"answer the console's clone-clock (0x77) with a host clock message; the console's ClockProtocol is parked in state 4 and an inbound clock message resets its state machine (report 157)" = "用主机时钟消息回应游戏机 0x77 克隆时钟请求。"
"answer the console's offer with this 232-byte box structure (echo: its own back), and its commits with commits" = "以此 232 字节盒子记录回应游戏机的交换请求，并回应提交；echo 表示返还对方宝可梦。"
"answer the console's request for NetDataIsMatchWaitData (0x23) with isMatchWait=1 instead of 0. ONE comparison in UnionRoomManager$$SetNetData gates the trade on it (`cmp w23, #1` at main.bin 0x01fd56e4, then UnionFrontDeskTradeController$$StartMatch); every run has answered 0, which is a station declining to be matched" = "以 isMatchWait=1 回应 NetDataIsMatchWaitData（0x23）请求，表示允许交换匹配；0 表示拒绝匹配。"
"answer the console's trade messages with ours. It sends a trainer record and then a Pokemon and waits; with neither answered the player sits on \"En attente d'une reponse\". THIS DOES NOT COMPLETE A TRADE - the player still confirms on their own screen, and declining there leaves the save untouched" = "用本机训练家记录及宝可梦回应对方交换消息，避免停在等待响应。玩家仍须自行确认；此选项本身不完成交换。"
"answer the host's Net 0x11 with the 0x12 ack. A retail joiner does not, and the ack makes the console ask for host migration instead (sv08)" = "以 Net 0x12 确认主机 0x11。实机加入方不这样回应；发送确认可能使主机要求迁移。"
"answer the host's offers with a box structure of our own. 'echo' returns the host's own, which the game accepts by construction; a path is a 232-byte structure, encrypted or not. Repeatable, one per trade on the seat; trade N writes what it received to --received with -N. After the last, a further trade is not answered and the player backs out" = "用本机 232 字节盒子记录回应主机提议，可为加密或已解密文件；echo 返还对方宝可梦。可重复指定，各次交换依次使用；接收文件在 --received 后加 -N。队列完成后不再回应。"
"answer the host's type-7 leave-with-host-migration with a type-8 ack, telling it we accept the host role it is handing over" = "用类型 8 确认回应主机类型 7 的迁移离开请求，表示接受主机角色。"
"answer the ready-ok, after which the console writes its save" = "回应 ready-ok，随后游戏机写入存档。"
"answer the trade RPC on its OWN Pia port with its own reliable window. The console sends them on 0x7C port 1; an answer on port 0 lands on a window it does not read them on" = "在交换 RPC 自身的 Pia 端口回应，并维护独立可靠窗口；游戏机使用 0x7c 端口 1。"
"answer with `pokeldn.swsh.trade.SYNC_ANSWERS` instead of echoing one payload: the ping, and the three other sync holders the console is expected to raise after the trade snapshot. A payload with no rule is REPORTED and left unanswered - that report is the point of the run" = "按 pokeldn.swsh.trade.SYNC_ANSWERS 回应同步 holder，而非简单回显；没有规则的载荷会报告并保持不回应。"
"answered clock requests of our own before the participate (measured 10)" = "参与前本机时钟请求所需的已回复次数，实测为 10。"
"any" = "任意"
"any Pokemon Center, after the card is saved" = "保存卡片后的任意宝可梦中心"
"any cartridge; call no ROM address" = "任意卡带；不调用 ROM 地址"
"any other record field by name: shiny_type=3, ball=1, held_item=236, gender=1, nature=10, ability_type=2, iv_hp=31, dynamax_level=10, gigantamax=1, tid=12345, sid=54321 ..." = "按名称设置活动记录字段，例如 shiny_type=3、ball=1、held_item=236、gender=1、nature=10、iv_hp=31、dynamax_level=10、gigantamax=1、tid=12345、sid=54321。"
"append completed joined-attempt records to daily csv files in DIR; default: disabled (the supervised shell host enables logs/)" = "将已完成的连接尝试追加到此目录的每日 CSV 文件，默认关闭。"
"append what the console says about itself - its card counters, its four questionnaire words and its Easy Chat battle profile - to this jsonl ledger. tools/frlg/game_data_read.py reads it back and says what moved between sessions" = "将游戏机卡片计数器、四词问卷及简易聊天对战资料追加至 JSONL；可用 tools/frlg/game_data_read.py 比较会话间的变化。"
