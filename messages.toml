"square spawns one avatar per corner; line and fixed ask whether the game's idea of identity is the station or the position" = "角色布置模式：square 在各角生成角色；line 和 fixed 用于比较身份与站点／位置的关系。"
"stamp distributions require both activation scripts" = "印章分发需要两个激活脚本"
"stamp flow requires a stamp and both activation scripts" = "集章流程需要印章和两个激活脚本"
"stamp must be exactly four bytes" = "印章必须恰好为四个字节"
"stamp our own clock on the take-over instead of the clock the peer's announcement carried. The peer completes a take-over only when it matches the sequence it allocated, so the echo is the default" = "接管时写入本机时钟，而非回显对方公告时钟；默认回显以匹配对方分配的序列。"
"standard" = "普通"
"starter-egg" = "初始宝可梦的蛋"
"stat-judge" = "个体值与努力值鉴定"
"state_var must be a Stamp Rally state variable" = "state_var 必须为集章活动状态变量"
"stay silent after a join, to measure what the joiner does unprompted" = "加入后保持静默，观察对方未被提示时的行为。"
"stay silent; the run then measures what the console sends on its own" = "保持静默，测量游戏机自行发送的数据。"
"steel" = "钢"
"stop after the post-delivery RFU close sequence; used by the supervised run_mystery_gift.sh host" = "控制是否在发送成功并完成 RFU 关闭序列后结束，用于受监督的 run_mystery_gift.sh 主机。"
"stop after this many seconds without meaningful Switch traffic (join or Pia/RFU datagram); default: disabled" = "连续没有有效 Switch 通信时停止的秒数，默认关闭。"
"string-gather" = "收集文字"
"sudo usermod -aG dialout $USER" = "sudo usermod -aG dialout $USER"
"sword" = "剑"
"table-scan" = "扫描数据表"
"tera" = "太晶"
"test only, for bin/lgpe_join.py: act as a console host's player, each step this many seconds after the last. Offer unprompted after the party clones and after each result, vote on the offered clone, announce and vote the commit clone, commit (docs/lgpe_session.md). Never against a console" = "仅供 bin/lgpe_join.py 测试：模拟游戏机主机玩家的提议、投票和提交，各步骤按此秒数间隔执行。不要用于真实游戏机。"
"test only, for bin/swsh_connect.py: act as a console host's player: after a trade with another --offer-file queued, offer it from the box this many seconds after the ladder, without waiting for the joiner's offer" = "仅供 bin/swsh_connect.py 测试：模拟主机玩家，有下一个 --offer-file 时在流程结束后等待此秒数再从盒子主动交换。"
"test only: carry the drive on through a withdrawn vote, as the host did before it answered state 2 (docs/lgpe_session.md). Locks a console's save" = "仅供测试：在确认已撤回后仍继续推进，复现主机处理状态 2 前的旧行为。会锁住游戏机存档的交换功能，详见 docs/lgpe_session.md。"
"test only: ignore the console's first answer to our clone 0 pair, as if lost, so the pair goes again" = "仅测试：忽略游戏机对首个克隆 0 数据对的回应，模拟丢包以验证重发。"
"test only: send no answer to the host's first clone 0 pair (0xa1, 0xb1), as if lost, to see whether the host repeats it" = "仅测试：不回应主机首个克隆 0 数据对（0xa1、0xb1），检查其是否重发。"
"test only: skip the first N of our announcements to the console alone, as if lost, so the resend carries them" = "仅测试：跳过发给游戏机的前 N 次公告，模拟丢包。"
"test only: skip the first N of our announcements to the host alone, as if lost, so the resend carries them" = "仅测试：跳过发给主机的前 N 次公告，模拟丢包。"
"the --raid-boss boss is Gigantamax; a retail console accepts it where a base den holds that Gigantamax Pokemon (docs/swsh_raid.md)" = "将 --raid-boss 首领设为超极巨化；实机只接受基础巢穴中存在的对应超极巨化宝可梦（docs/swsh_raid.md）。"
"the 16-byte player id in the join request: 'arceus' (1 then 0 as two big-endian u64, what a retail Arceus states), 'random', 'high' (random with a leading 0xff) or 32 hex digits. A Scarlet host's own is 10047bd4a25543e057cee5c71ab1f2a2 (sv18)" = "加入请求的 16 字节玩家 ID：arceus 使用参考阿尔宙斯 ID，random 随机，high 以 0xff 开头，或直接填写 32 个十六进制数字。"
