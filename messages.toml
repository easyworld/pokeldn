"host the room the player enters with this password, e.g. 00000000" = "创建玩家通过此密码进入的房间，例如 00000000。"
"how far to advance a trade RPC's clock in our answer. 5 is nxldn-lab's and is the one number in this path nothing here has measured" = "交换 RPC 回应的时钟增量；参考值为 5，此值在本路径尚未实测。"
"how long one connection request waits for its answer" = "单个连接请求等待响应的最长时长。"
"how long one seat is held" = "单次连接的保持时长。"
"how long silence has to last to count as an ack that landed" = "多久没有重传即认定确认已成功。"
"how long to hold one seat" = "单次连接的保持时长。"
"how long to hold the network up" = "保持网络开启的时长。"
"how long to host" = "担任主机的持续时长。"
"how long to keep acking the mesh join response; the host repeats it every 500 ms until it is acknowledged" = "持续确认网络加入响应的时长；主机在确认前每 500 毫秒重复响应。"
"how long to keep retransmitting if nothing acknowledges it; 0 sends until the run ends" = "没有确认时持续重传的时长；0 表示直到运行结束。"
"how long to keep trying" = "持续尝试连接的时长。"
"how long to retransmit the connection request and listen for its reply" = "持续重发连接请求并等待响应的秒数。"
