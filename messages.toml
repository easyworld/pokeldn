"how many RFU slots a second the host emits (default 59.727, one per GBA VBlank). A real console pair runs far below this; lowering it slows every link step by the same factor." = "主机每秒发送的 RFU 时隙数，默认 59.727（每个 GBA 垂直空白帧一个）。降低此值会按相同比例放慢所有连接步骤。"
"how many kind 1 identities to send, 0.3 s apart under successive steps" = "发送类型 1 身份的次数，每次间隔 0.3 秒，步骤编号递增。"
"how many party clones (ids 2 up) to announce after the identities; the reference host announced two" = "身份发送后公布的队伍克隆数量（ID 从 2 开始），参考主机公布两个。"
"how many selection records to send; a reference joiner sent sixteen" = "选择记录的发送次数，参考加入方发送十六次。"
"how many sequence ids of ours to send in all; 0 has no limit. One message does not hold the console's state; it sends its own heartbeat about 580 times in 180 s" = "本机发送的序列 ID 总数上限，0 表示不限制。"
"how many times to ack the acceptance; the console repeats it until acked" = "确认接受消息的次数；游戏机在确认前持续重发。"
"how many times to retransmit the approach before giving up" = "放弃前重发靠近请求的次数。"
"how many times to send it; a console sends four" = "离开消息的发送次数，游戏机发送四次。"
"how many values of the byte at offset 1 to try" = "偏移 1 字节的测试值数量。"
"how often to broadcast it; the console sent one about every 2 s" = "网络更新的广播间隔；游戏机约每两秒发送一次。"
"how often to retransmit the migration response until it is acked" = "迁移响应未确认时的重传间隔。"
