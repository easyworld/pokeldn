"bug" = "虫"
"build the record in --offer-slot instead of sending it as it came: this national dex number, in the party record the snapshot advertises AND in the offer, so the two still tell one story" = "按全国图鉴编号构建 --offer-slot 中的宝可梦，同时更新快照队伍及交换提议以保持一致。"
"bundle the record set N to a packet, each after the first with its header inherited, as a retail host's retransmit round does (docs/sv.md)" = "每包捆绑的身份记录数量；后续记录继承首条头部，与实机重传方式一致。"
"by an unnamed author" = "作者未署名"
"byte [1]. 0xFD is what 0x017c1700 compares against; anything else is the instrument that says the handler was reached" = "字节 [1]。处理器在 0x017c1700 比较 0xFD；其他值用于验证是否到达处理器。"
"bytes" = "字节"
"bytes written over the record at OFFSET before sealing, for the fields no name covers (0x15=0b for the title index); repeatable" = "封装前在 OFFSET 位置覆盖指定字节，供未命名字段使用，例如 0x15=0b；可重复指定。"
