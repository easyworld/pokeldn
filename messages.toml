"A game boost is a change to how your game plays, such as walking through walls or a faster game. Select the boosts and send them through Mystery Gift. They start immediately and stop when you restart the game or turn off the console. To restore them later, save them in the game and send Mom's gift below." = "增强功能可改变游戏玩法，例如穿墙或加速。选择功能并通过神秘礼物发送，接收后立即生效，重启游戏或关闭游戏机后停止。若要以后恢复，请将功能保存到存档，并发送下方的妈妈礼物。"
