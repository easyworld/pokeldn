"seconds after the host's confirmation before the joiner commits; the pair's joiner committed 1.5 s after its own confirmation and its host answered in kind" = "主机确认后至加入方提交的秒数；参考加入方在自身确认后 1.5 秒提交。"
"seconds after the host's confirmation before the joiner's own" = "主机确认后至本机确认的秒数。"
"seconds after the host's key-0x80 open at which the joiner offers first, before the host does; without it the joiner answers the host's offer" = "主机打开 key 0x80 后，本机先行提议的秒数；未指定则等待主机提议。"
"seconds after the identity before the selection record starts; a reference joiner waits about 0.46 s" = "身份发送后至选择记录发送的秒数，参考加入方约 0.46 秒。"
"seconds after the join response (after the seat without --session-join) before the eleven acks and the two stream opens go out; a retail joiner opens 0.75 s after its join" = "加入响应后至发送十一条确认及两个流打开消息的秒数；不启用 --session-join 时从连接建立计时，实机约 0.75 秒。"
"seconds after the party clones to move our state word to 2 and send the offer, which is what a station does as its own state word reaches 2" = "队伍克隆公布后，等待多少秒将状态字设为 2 并发送交换提议。"
"seconds after the player's trade emote before our character approaches (no walk)" = "玩家发出交换表情后，本机角色靠近前的秒数（直接靠近，不播放行走）。"
"seconds after the seat at which the host offers first, before the console does, as a pair's host did; without it the host answers the console's offer" = "连接建立后本机主动提供宝可梦的秒数；未指定则等待并回应对方提议。"
"seconds after the seat before the first identity record goes out" = "连接建立后至首条身份记录发送的秒数。"
"seconds after the seat before the record set goes out" = "连接建立后至发送身份记录的秒数。"
"seconds after the seat before the type 7 goes out; a pair's host sends it at about 2.3" = "连接建立后至类型 7 公告的秒数，参考主机约 2.3 秒。"
"seconds after the second commit to send the result, the next trade's first slot, with two clones announced 0.5 s before it; a retail host sent it 26.8 s after, behind its trade animation" = "第二次提交后至发送结果的等待秒数；提前 0.5 秒公布两个克隆。实测主机在交换动画后约 26.8 秒发送结果。"
"seconds after the streams open before the offer goes out" = "流打开后至宝可梦提议发送的秒数。"
"seconds after the take-over burst to publish our copy, with --publish-on-announce. Zero puts it in the burst's own frame" = "配合 --publish-on-announce，接管突发后等待此秒数再发布本机副本；0 表示在同一帧发布。"
"seconds after the walk before the first request" = "行走后至首个请求的等待秒数。"
"seconds between approach retransmissions" = "靠近请求的重传间隔秒数。"
"seconds between one request landing and the next going out" = "收到前一个请求响应后，发送下一个请求前的间隔秒数。"
"seconds between our own RTT requests (0 sends none)" = "本机 RTT 请求间隔秒数，0 表示不发送。"
"seconds between position messages in the burst pattern. The default is the console's own median gap" = "突发行走中位置消息的间隔秒数，默认实机测得的中位间隔。"
"seconds between repeats of our security-phase state, until the console reports SEND_READYOK. A CHILD console's SEND_READYOK only ends when a message arrives inside it" = "安全阶段状态的重复发送间隔，直到对方报告 SEND_READYOK。"
"seconds between requests; the console answered BDSP's in 40 ms" = "请求间隔秒数，晶灿钻石／明亮珍珠实测响应约 40 毫秒。"
"seconds between selection records; a reference joiner sends about four a second, each under a fresh sequence" = "选择记录的发送间隔秒数，参考加入方每秒约四次，各自使用新序列。"
"seconds between the Session join response and the station-list update; a Scarlet host leaves about 1.5 s" = "加入响应至站点列表更新之间的秒数；朱版主机约为 1.5 秒。"
"seconds between the approach answer and each --after-approach message" = "靠近回应与各 --after-approach 消息之间的秒数。"
"seconds between the payloads of --reliable-payload" = "--reliable-payload 各数据载荷之间的间隔秒数。"
"seconds between the periodic bulk acks on every port the console used" = "对游戏机使用的各端口发送定期批量确认的间隔秒数。"
"seconds between the periodic bulk acks on every stream the host uses" = "对主机使用的每条流发送定期批量确认的间隔秒数。"
"seconds between the queued post-offer payloads. Spread them so the sweep spans the accept: the console tears down on the accept, not on a timer, so commands sent inside a couple of seconds all land before it" = "提议后排队发送的载荷之间的秒数，用于使测试跨越玩家接受的时刻。"
"seconds between the record packets; a retail raid host spreads its identity over about 0.13 s" = "记录数据包之间的间隔秒数；实机团体战主机约用 0.13 秒发送身份数据。"
"seconds between the steps the host drives an offered clone through" = "主机推进所提供克隆对象各步骤的间隔秒数。"
"seconds between the talk answer and each --after-talk message" = "聊天回应与各 --after-talk 消息之间的秒数。"
"seconds each fragment stays on the air" = "每个片段持续广播的秒数。"
"seconds each sweep variant stays live" = "每种确认测试组合持续的秒数。"
"seconds in the raid lobby before our player readies" = "我方玩家在团体战大厅等待多少秒后准备就绪。"
"seconds of listening before the first packet out, so the capture holds the console's own rate to compare against" = "首次发送前的监听秒数，用于捕获游戏机自身发送频率。"
"seconds past --connect-seconds or --hold to keep a seat whose trade is half done: a trade left mid-way locks the console out of trading" = "超过 --connect-seconds 或 --hold 后，保留未完成交换的连接时长；中途离开可能触发游戏的交换限制。"
"seconds past --hold to keep a session whose trade is under way: the console has offered and the ladder has not finished" = "超过 --hold 后，保留已开始且尚未完成交换的连接的秒数。"
"seconds past --seconds to hold a session whose trade is half done" = "超过 --seconds 后，为未完成交换继续保持连接的秒数。"
"seconds per channel in a scan" = "扫描时每个信道的停留秒数。"
"seconds per channel in the scan; 0.8 missed a live network twice" = "扫描各信道的停留秒数；0.8 秒曾在实机扫描中两次错过网络。"
"seconds per channel in the scan; the console's hosting window is a few seconds, so a long dwell misses it" = "扫描各信道的停留秒数；主机窗口仅几秒，停留过久可能错过。"
"seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own" = "关联连接本身的超时秒数，避免主机阶段结束时 ldn.connect 一直等待。"
"seconds to wait after the console starts advertising before approaching" = "对方开始招募后，主动靠近前的等待秒数。"
"seconds to wait for a reply; every probe gets one, so this is short" = "各次探测等待响应的秒数。"
"seconds without an update session that count as the rebroadcast stopping - the console sends ten a second, so this is fifteen missed" = "多久未收到会话更新即判定广播停止；游戏机每秒发送十次，此值约对应十五次丢失。"
"send APPLICATION DATA once the mesh is up - the first of the project. The payload as hex; \"610000000a00\" is the six bytes the console repeats at us on 0x7C. Nothing is sent without this flag" = "网络建立后发送应用数据（十六进制）。610000000a00 为游戏机重复发送的六字节内容；未指定则不发送。"
"send N well-formed connection requests and report what comes back" = "发送 N 个有效连接请求，并报告响应。"
"send Session type 2 unicast before type 5 broadcast" = "先发送 Session 类型 2 单播，再发送类型 5 广播。"
"send a version-9 station connection request to the host and classify the reply, retransmitting every 0.5 s the way Pia does. Without it, listen only" = "向主机发送版本 9 的连接请求并判定响应，每 0.5 秒重发；未启用时仅监听。"
"send an RTT request this often, as a pair's host does every 410 ms; the host otherwise only answers them" = "本机主动 RTT 请求间隔，参考主机约 410 毫秒；否则本机仅回应请求。"
"send back whatever the console last said on this protocol, rather than the fixed --send-data. --send-data is still the first payload, before the console has said anything" = "回传游戏机在此协议上的最后一条内容，替代固定 --send-data；首次仍发送 --send-data。"
"send each block fragment once (fire-and-forget) instead of the console's re-send-until-confirmed loop. Default off (faithful re-send): against the real client, a block streams in 1-2s with aggressive re-sends (~1.5x) and completes; trust_pia's send-once crawled (~0.1 frag/s) and never completed. trust_pia was a workaround for the 'flood', but that was the rtt deadlock (now fixed). --trust-pia re-enables send-once" = "控制数据块发送方式。默认按游戏机行为持续重传直至确认；--trust-pia 改为只发送一次。实测持续重传可完成传输，单次发送可能过慢。"
"send every record the host puts on 0x81 port 0 back on port 1 as our own, in order. A retail joiner answers the host's records with a set of its own; this fills that set with records the game itself composed" = "将主机 0x81 端口 0 的每条身份记录依次镜像到本机端口 1。"
"send nat flags 5 and nat location 1. A Let's Go joiner sends zero for both on local wireless" = "发送 NAT 标志 5、位置 1；Let's Go! 本地无线加入方通常都填 0。"
"send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference" = "不发送默认站点身份；仅在 --record-set 或 --send-on-open 明确指定时发送。"
"send our PK8 as a Data on elementId 10000 and as a holder on the 30000-base id (30050), which every content registers. More than one variable at once" = "同时以 elementId 10000 的 Data 及 30050 holder 两种形式发送 PK8，此选项同时改变多个变量。"
"send our own 40050 pair the moment the console says id 130 pingSynced, before its own selection burst. nxldn-lab's client opens the selection phase this way and nothing here has ever opened one; the console sends 820000001a00 in our own captures 0.3 s before its 40050 burst" = "收到同步 holder 130 的 pingSynced 时，在对方选择消息前发送本机 40050 对。"
"send the 0x3c-byte connection response instead of the full 0x348-byte one, which carries no network id and no player" = "发送 0x3c 字节的短连接响应，替代含网络 ID 和玩家资料的 0x348 字节完整响应。"
"send the Net 0x50 update-property message a pair's host sends 0.37 s after its 0x11, retransmitting until the console's 0x51" = "发送 Net 0x50 属性更新，参考主机在 0x11 后约 0.37 秒发送，并重传至收到 0x51。"
"send the Pia Session join request in the retail layout (docs/sv.md, The Session join request): ten protocols with their versions, a four-byte nonce, both location ids, a seven-byte station address and one player record. A mesh join is unicast, so no passive capture shows a retail one" = "按实机布局发送 Pia Session 加入请求：协议及版本、nonce、位置 ID、站点地址及玩家记录。"
"send the Session join request once the console's Net is acknowledged" = "游戏机 Net 请求得到确认后发送 Session 加入请求。"
"send the Session join request with no Net 0x12 answer to the host's 0x11; the 0x12 is what a console answers by asking for host migration" = "发送 Session 加入请求时不以 Net 0x12 回应主机 0x11；该回应可能触发主机迁移。"
"send the announcement of our own copy a tick after the take-over burst. Both stations of a session that works put all seven in one frame, which is the default here" = "接管突发后的下一时钟步才公布本机副本；默认将所有七条消息放在同一帧。"
"send the band's Net connection request once seated" = "连接建立后发送 Net 连接请求。"
"send the game's type-3 join on 0x7c port 2 with the channel table, rather than in answer to the console's type-7 announcement on 0x80 port 2. A pair's joiner answers the announcement (docs/sv.md, Port 2)" = "随通道表立即发送端口 2 类型 3 加入；默认等待对方 0x80 端口 2 类型 7 公告后回应。"
"send the host's own record on the 0x81 data exchange once the console opens its stream; the exchange the trade scene is the success branch of" = "游戏机打开流后，在 0x81 数据交换协议发送本机记录。"
"send the offer under a new PID and encryption constant, shiny state kept, so a save that took this record before takes it again" = "为提供记录生成新 PID 及加密常量，保留异色状态，使已接收过的存档可再次接收。"
"send the requests to the console rather than the broadcast address" = "将请求单播给游戏机，而非广播。"
"send them to the broadcast address instead" = "将请求发往广播地址。"
"send these box commands as soon as the console acks our 0x84 snapshot - BEFORE either side offers a Pokemon. The game sends command 3 exactly once, on the first frame after its trade session is built and only when the role bit at session+0x419 is clear (0x010c9bb0), so one of the two sides owes the other an opener before anything else happens. Sent after both offers instead, the console leaves while the player is still picking" = "0x84 快照得到确认时，在双方提供宝可梦之前发送这些盒子命令，尝试打开交换流程。"
"send these box commands the moment MIGRATION_START arrives - the only signal that says the player pressed accept. The console keeps acking for about five seconds after it" = "收到 MIGRATION_START 时立即发送这些盒子命令；该消息表示玩家已接受，游戏机还会继续确认约五秒。"
"send this 139-byte record file instead of building one" = "发送此 139 字节记录文件，替代现场构建。"
"send this directory's records as our own on 0x81 port 1, in sequence order, in place of --mirror-records. `scratchpad/sv_extract_records.py` writes one from a station's own log, so a whole real identity can be replayed rather than the host's mirrored back; by default the recorded set in pokeldn.sv.reference" = "在 0x81 端口 1 依次发送此目录中的本机身份记录，替代镜像主机记录；默认使用 pokeldn.sv.reference。"
"send to the console rather than the broadcast address" = "将数据单播给游戏机，而非广播。"
"send to the host's address instead of the LDN broadcast address. Both retail stations broadcast every Pia packet (sv11), and a broadcast needs no ARP resolution of the peer" = "单播到主机地址，替代 LDN 广播。实机双方广播所有 Pia 包，广播无需对方 ARP 解析。"
"sendType must be 0, 1 or 2" = "sendType 必须为 0、1 或 2"
"serve the raid battle from this station with a plugin's battle server (NAME, or the first one loaded): the console and our Pokemon fight one battle; one console only; a failure hands the network over as without it (docs/sv_raid.md, Serving the battle)" = "通过插件的对战服务器从此站点提供团体战服务；指定 NAME，或使用首个已加载服务器。游戏机与程序宝可梦参与同一场对战，仅支持一台游戏机。失败时按未启用此选项的方式交出网络。"
"server script ran off the end without SVR_RETURN" = "服务端脚本运行到末尾但未执行 SVR_RETURN"
"set a field of the League Card the console may keep after the trade (pokeldn.swsh.league_card: name, trainer_id, dex_owned, poke1_species, ...)" = "设置交换后游戏机可能保留的联盟卡字段，例如 name、trainer_id、dex_owned、poke1_species。"
"set the adapter's MAC before associating, e.g. 48:f1:eb:11:22:33. Pia derives a station's constant id from its MAC, and the two consoles' are Nintendo OUIs where the adapter's is not. The driver reload in the launcher puts the adapter's own address back" = "关联前设置适配器 MAC，例如 48:f1:eb:11:22:33；Pia 固定 ID 由 MAC 推导，启动器重载驱动后恢复原地址。"
"settings must be an object" = "设置必须为对象"
"shared host TOML (default: config/host.toml)" = "共享主机 TOML 配置，默认 config/host.toml。"
"shield" = "盾"
"shiny" = "异色"
