"six IVs 0 to 31 (default each random, as a wild one's)" = "六项个体值，范围为 0 到 31；默认按野生宝可梦规则分别随机生成。"
"six IVs, comma-separated, in PKHeX's HP,ATK,DEF,SPE,SPA,SPD order" = "六项个体值，用逗号分隔，顺序为 HP、攻击、防御、速度、特攻、特防。"
"sloop-svc" = "sloop-svc"
