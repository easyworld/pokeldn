"rse-gift:--adapter" = "--phy 为 auto 时使用的 Wi-Fi 适配器配置。"
"rse-gift:--artifact-dir" = "--make-artifact 的输出目录，默认 artifacts。"
"rse-gift:--attempt-log-dir" = "将已完成的连接尝试追加到此目录的每日 CSV 文件，默认关闭。"
"rse-gift:--block-repeat" = "每个块片段重复发送次数，1 至 8，默认 2，用于应对静默丢包。"
"rse-gift:--buffer-script" = "通过 CLI_RUN_BUFFER_SCRIPT 在游戏机运行原生 ARM 代码，替代礼物发送。支持存档／内存读取、存档写入、随机数追踪、内存／表扫描、ROM 校验、函数调用、宝可梦创建及常驻增强等脚本；按所选脚本配置下方参数。写入类操作须启用 --write-unsafe。；rom-reset-probe：通过 swi 0x48 fold，将 4 KB 的模式数据写入 ROM 副本的 0x08000000 + n * 0x1000 地址，再执行 GBA 软重置，以验证 ROM 副本中的写入能否在软重置后保留。第二次神秘礼物会话转储该地址（--rom-fold-n、--rom-fill-base；需要 --write-unsafe）"
"rse-gift:--call-address" = "调用的 THUMB ROM 函数地址，最低位置 1，请与 --console-build 对应。法语版 SeedRng／Random 为 0x080486D1／0x080486B1，英语版为 0x08048691／0x08048671；0 表示不调用。"
"rse-gift:--call-arg" = "函数调用的参数字，可重复指定，最多八个。前四个放入 r0 至 r3，其余放在栈上。"
"rse-gift:--call-watch" = "函数调用前后各读取一次的地址，两次值都会返回。gRngValue：法语版 0x03004220，英语版 0x030042D0。"
"rse-gift:--capture" = "将协议诊断记录保存为 JSONL 文件。"
"rse-gift:--card-flag-id" = "联合房间交换训练家卡时声明的神奇卡片标志 ID。持有同 ID 卡片的游戏机会启用计数器，交换或竞技场对战将增加计数。默认 0，不启用计数。"
"rse-gift:--chain-step" = "call-chain 的步骤，可重复指定，最多 16 步，在同一帧依次执行。call:NAME_OR_ADDR[,ARG]... 调用函数；read32|read16|read8:ADDR 读取；write32|write16|write8:ADDR,VALUE 写入并读回，须启用 --write-unsafe。prev 表示上一步结果，prev+N 表示其后 N 字节。"
"rse-gift:--client-ready-idle-frames" = "诊断：LinkPlayer 待机后，首个神秘礼物消息前的空闲轮询帧数；默认内置时序。"
"rse-gift:--comm-id" = "十六进制 LDN 本地通信 ID（local_communication_id）。"
"rse-gift:--config" = "共享主机 TOML 配置，默认 config/host.toml。"
"rse-gift:--console-build" = "选择生成代码使用的卡带地址。auto 根据游戏机报告的卡带代码自动选择对应语言和版本，不匹配的代码会被拒绝。"
"rse-gift:--create-mon-append" = "将创建的宝可梦加入玩家队伍的第一个空位；队伍已满时不写入。修改真实存档且会保存，须启用 --write-unsafe。"
